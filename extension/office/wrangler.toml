name = "addins-dust-tt"
compatibility_date = "2026-10-14"
# Terraform in dust-infra owns the custom domain. No alternate public origins.
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
# Office manifests and the WorkOS callback use exact .html URLs.
html_handling = "none"
# Missing assets or future platforms must return 404, not the Excel task pane.
not_found_handling = "none"
