# Configuration for mprocs to run the dev environment locally.
# Requirements:
# * mprocs (`brew install mprocs`)
# * bacon (`cargo install bacon`)
# * FoundationDB client library for dfs-api (`tools/install-fdb-client.sh`)

# ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️
# you need to restart front-workers after sdks-js is loaded: select front-workers in the mprocs window and press r
# ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️

procs:
  _check-start-script:
    cwd: "<CONFIG_DIR>/.."
    cmd: ["bash", "tools/check-start-mprocs.sh"]
    autostart: true
    autorestart: false

  core:
    cwd: "<CONFIG_DIR>/../core"
    shell: "bacon core-api"

  sqlite-workers:
    cwd: "<CONFIG_DIR>/../core"
    env:
      CORE_API: "http://localhost:3001"
      IS_LOCAL_DEV: "1"
      DATABASES_STORE_DATABASE_URI: "postgresql://dev:dev@localhost:5432/dust_databases_store"
      CORE_API_KEY: "soupinou"
    shell: "bacon sqlite-worker"

  oauth:
    cwd: "<CONFIG_DIR>/../core"
    shell: "RUST_BACKTRACE=1 bacon oauth"

  dfs-api:
    cwd: "<CONFIG_DIR>/../dfs/server"
    shell: "bacon dfs-api"
    autostart: true

  sparkle:
    cwd: "<CONFIG_DIR>/../sparkle"
    shell: |
      npm run watch

  sdks-js:
    cwd: "<CONFIG_DIR>/../sdks/js"
    shell: |
      ./admin/dev.sh

  migrations:
    cwd: "<CONFIG_DIR>/.."
    env:
      READY_FILE: "sdks/js/dist/client.esm.js.map"
    shell: "bash tools/run-migrations.sh"

  front-api-hono:
    cwd: "<CONFIG_DIR>/../front-api"
    env:
      NODE_ENV: "development"
      HOSTNAME: "0.0.0.0"
      # Guard: throw if anything tries to load `next` at runtime.
      NODE_OPTIONS: "--require=./forbid-next.cjs"
      READY_FILE: "../sdks/js/dist/client.esm.js.map"
      COLLAB_INTERNAL_URL: "http://localhost:3013"
      COLLAB_INTERNAL_SECRET: "dev-collab-secret"
    shell: |
      echo "Waiting for sdks-js to compile..."
      echo "Expecting file: $READY_FILE"
      while [ ! -f "$READY_FILE" ]; do sleep 1; done
      echo "sdks-js ready. Starting front-api (Hono only, no Next)."
      npm run dev

  # collab: co-edition live session server (dev only), reached by front-spa through
  # VITE_DUST_COLLAB_URL. In a workspace with co_edition, Markdown files wait on it to be editable.
  # front-api-hono and front-workers reach it through COLLAB_INTERNAL_URL with the same secret.
  collab:
    cwd: "<CONFIG_DIR>/../front-api"
    env:
      NODE_ENV: "development"
      COLLAB_HOSTNAME: "localhost"
      COLLAB_PORT: "3013"
      COLLAB_INTERNAL_SECRET: "dev-collab-secret"
      READY_FILE: "../sdks/js/dist/client.esm.js.map"
    shell: |
      echo "Waiting for sdks-js to compile..."
      while [ ! -f "$READY_FILE" ]; do sleep 1; done
      npm run dev:collab
    autostart: false

  front-workers:
    cwd: "<CONFIG_DIR>/.."
    env:
      COLLAB_INTERNAL_URL: "http://localhost:3013"
      COLLAB_INTERNAL_SECRET: "dev-collab-secret"
    shell: "bash tools/wait-for-front-api.sh"

  connectors:
    cwd: "<CONFIG_DIR>/../connectors"
    env:
      READY_FILE: "../sdks/js/dist/client.esm.js.map"
    shell: |
      bash ../tools/wait-for-temporal.sh
      echo "Waiting for sdks-js to compile..."
      while [ ! -f "$READY_FILE" ]; do sleep 1; done
      echo "sdks-js ready. Starting connectors."
      ./admin/dev.sh
    autostart: false

  front-spa:
    cwd: "<CONFIG_DIR>/../front-spa"
    env:
      READY_FILE: "../sparkle/dist/.build-complete"
      VITE_DUST_COLLAB_URL: "ws://localhost:3013"
    shell: |
      echo "Waiting for sparkle to compile..."
      echo "Expecting file: $READY_FILE"
      while [ ! -f "$READY_FILE" ]; do sleep 1; done
      bash ../tools/wait-for-front-api-ready.sh
      npm run dev:app

  front-poke:
    cwd: "<CONFIG_DIR>/../front-spa"
    env:
      READY_FILE: "../sparkle/dist/.build-complete"
    shell: |
      echo "Waiting for sparkle to compile..."
      echo "Expecting file: $READY_FILE"
      while [ ! -f "$READY_FILE" ]; do sleep 1; done
      bash ../tools/wait-for-front-api-ready.sh
      npm run dev:poke

  marketing-site:
    cwd: "<CONFIG_DIR>/../marketing"
    env:
      READY_FILE: "../sparkle/dist/.build-complete"
    shell: |
      echo "Waiting for sparkle to compile..."
      echo "Expecting file: $READY_FILE"
      while [ ! -f "$READY_FILE" ]; do sleep 1; done
      echo "sparkle ready. Starting marketing site on port 3009."
      npm run dev -- -p 3009
    autostart: false

  sparkle-storybook:
    cwd: "<CONFIG_DIR>/../sparkle"
    shell: |
      npm run storybook
    autostart: false

  sparkle-playground:
    cwd: "<CONFIG_DIR>/../sparkle/playground"
    shell: |
      npm install && npm run dev
    autostart: false

  viz:
    cwd: "<CONFIG_DIR>/../viz"
    env:
      READY_FILE: "../sparkle/dist/.build-complete"
    shell: |
      echo "Waiting for sparkle to compile..."
      echo "Expecting file: $READY_FILE"
      while [ ! -f "$READY_FILE" ]; do sleep 1; done
      npm run dev
    autostart: true

  extension-chrome:
    cwd: "<CONFIG_DIR>/../extension"
    shell: |
      npm run dev:chrome
    autostart: false

  extension-firefox:
    cwd: "<CONFIG_DIR>/../extension"
    shell: |
      npm run dev:firefox
    autostart: false

  firebase-webhook-router:
    cwd: "<CONFIG_DIR>/../firebase-functions/webhook-router"
    shell: |
      if [ -f /.dockerenv ] || [ "${DUST_IN_CONTAINER:-}" = 1 ]; then
        echo "Skipping firebase-webhook-router compose: no Docker socket in shared dev container."
        exit 0
      fi
      docker-compose up --build
    autostart: false

  # apache-tika: Document text extraction. TIKA_URL=http://localhost:9998.
  apache-tika:
    cwd: "<CONFIG_DIR>/.."
    shell: |
      if [ -f /.dockerenv ] || [ "${DUST_IN_CONTAINER:-}" = 1 ]; then
        echo "Skipping apache-tika compose: no Docker socket in shared dev container."
        exit 0
      fi
      docker compose up apache-tika
    autostart: false

  # kibana: Elasticsearch UI. kibana_settings runs first as a docker-compose dep.
  kibana:
    cwd: "<CONFIG_DIR>/.."
    shell: |
      if [ -f /.dockerenv ] || [ "${DUST_IN_CONTAINER:-}" = 1 ]; then
        echo "Skipping kibana compose: no Docker socket in shared dev container."
        exit 0
      fi
      docker compose up kibana_settings kibana
    autostart: false

  # Gotenberg: Office/PDF document preview conversion (LibreOffice route).
  # front-api reads its URL from DOCUMENT_RENDERER_URL (set to http://localhost:3100).
  gotenberg:
    cwd: "<CONFIG_DIR>/.."
    shell: |
      if [ -f /.dockerenv ] || [ "${DUST_IN_CONTAINER:-}" = 1 ]; then
        echo "Skipping gotenberg compose: no Docker socket in shared dev container."
        exit 0
      fi
      docker compose --profile gotenberg up gotenberg
    autostart: false

  novu:
    # Doc: https://docs.novu.co/framework/studio
    shell: "npx --yes novu@latest dev --port 3000"
    autostart: false

  stripe:
    # Doc: https://app.notion.com/p/dust-tt/Runbook-Local-Dev-setup-720bffc7d67a447184cb957e9471380c?source=copy_link#5814f227351d4d258422e21e8de39c82/
    shell: "stripe listen --forward-to localhost:3000/api/stripe/webhook"
    autostart: false

  metronome:
      shell: |
        #!/bin/bash
        set -e
        URL_FILE="${DUST_INFRA_LOG_DIR}/sbx-dev-front-url"
        if [ ! -f "$URL_FILE" ]; then
          echo "🔗 Metronome webhook URL not available (file $URL_FILE not found). Run ensure-ngrok.sh and try again."
          exit 1
        fi
        WEBHOOK_URL="$(cat "$URL_FILE" | tr -d '\n')/api/metronome/webhook"
        echo "🔗 Register this as the Metronome webhook URL:"
        echo "    $WEBHOOK_URL"
        echo "   on https://app.metronome.com/sandbox/developer/notifications?tab=webhooks"
        echo ""
        if echo "${METRONOME_WEBHOOK_SECRET:-}" | grep -q "MISSING"; then
          echo
          echo "❌ ERROR: METRONOME_WEBHOOK_SECRET env var not set (still contains 'MISSING')."
          echo "   Get the real secret from Metronome when registering the webhook."
          exit 1
        else
          echo "✅ OK: METRONOME_WEBHOOK_SECRET env var set. 👉 Make sure it matches the one from the webhook."
        fi
      autostart: false

