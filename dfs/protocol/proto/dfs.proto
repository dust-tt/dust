syntax = "proto2";

package dfs.v1;

// Additional behavioral requirements and validation limits are specified in ../CONTRACTS.
// All calls are unary and authenticate with authorization: Bearer <key> metadata.
// Session-key calls derive their tenant and subjects exclusively from the authenticated session.
service Dfs {
  // Requires the server key; tenant_id names the tenant to create.
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);

  // Requires a tenant key; the authenticated key determines the tenant.
  rpc CreateSession(CreateSessionRequest) returns (Session);

  // Requires an active session key; returns the authenticated session.
  rpc CurrentSession(Empty) returns (Session);

  // Requires an active session key; closes the authenticated session.
  rpc CloseSession(Empty) returns (Empty);

  // Requires a tenant key; the authenticated key determines the tenant.
  rpc ListGrants(ListGrantsRequest) returns (GrantPage);

  // Requires a tenant key; the authenticated key determines the tenant.
  // @cc [owner:spolu,label:api;concurrency;error-handling] dfs-update-grants-result
  // Success MUST return Empty after the atomic grant update completes. Failures MUST use gRPC
  // status with ErrorDetails and MUST NOT commit partial grant changes.
  rpc UpdateGrants(UpdateGrantsRequest) returns (Empty);

  // Requires an active session key.
  rpc Stat(StatRequest) returns (AttrBatch);

  // Requires an active session key.
  rpc Lookup(LookupRequest) returns (AttrBatch);

  // Requires an active session key.
  rpc List(ListRequest) returns (EntryPage);

  // Requires an active session key.
  rpc Read(ReadRequest) returns (ReadData);

  // Requires an active session key.
  rpc ReadFiles(ReadFilesRequest) returns (FilesBatch);

  // Requires an active session key.
  rpc Validate(ValidateRequest) returns (ValidationBatch);

  // Requires an active session key.
  rpc Apply(ApplyRequest) returns (OperationBatch);

  // Requires an active session key.
  rpc Search(SearchRequest) returns (SearchResults);
}

message Empty {}

// The value contains exactly 16 UUIDv7 bytes, including for the stored tenant root.
message ObjectId {
  required bytes value = 1;
}

// Virtual tags are selected with true; an absent value or a false tag is invalid.
message ObjectRef {
  oneof value {
    ObjectId id = 1;
    bool root = 2;
    bool shared = 3;
  }
}

// Optional timestamps distinguish absence from zero; all timestamps are Unix milliseconds.
message Attr {
  required ObjectRef id = 1;
  required ObjectRef parent = 2;
  required bool directory = 3;
  required uint64 size = 4;
  // @cc [owner:spolu,label:api;security] dfs-attribute-mode
  // For real objects, mode MUST equal the current session's effective grant permissions shifted
  // left by six bits: r=0o400, w=0o200, x=0o100. It MUST be derived from the authorization state
  // used for the response, not stored as independent permissions. Group, other, special, and
  // file-type bits MUST be zero. Virtual root/shared MUST report read/traverse access (0o500).
  required uint32 mode = 5;
  optional uint64 atime = 6;
  optional uint64 mtime = 7;
  optional uint64 ctime = 8;
  required uint64 attr_version = 9;
  // Directory entry versions include session-visible membership changes caused by grants.
  required uint64 content_version = 10;
  required ReadView view = 11;
  optional ExtendedMetadata metadata = 12;
}

message ExtendedMetadata {
  required uint64 created = 1;
  required string full_path = 2;
  required string mime_type = 3;
  map<string, bytes> xattrs = 4;
}

message ReadView {
  required int64 store_version = 1;
  required int64 auth_version = 2;
}

// Exactly one rule is required. Rules inherit from root to object; a deeper ALLOW can restore bits.
// At each object, subjectless DENY modes remove inherited bits before matching ALLOW modes are added.
message Grant {
  oneof kind {
    AllowGrant allow = 1;
    DenyGrant deny = 2;
  }
}

message AllowGrant {
  // An exact session subject, such as u:spolu@dust.tt or g:engineering.
  required string subject = 1;
  // @cc [owner:spolu,label:api] dfs-allow-mode
  // Mode MUST use r=4, w=2, x=1 and contain only bits in 0o7. Matching ALLOW modes MUST add
  // these permissions after local DENY modes remove inherited permissions. Zero MUST leave
  // permission bits unchanged. Other bits MUST fail with INVALID_INPUT.
  required uint32 mode = 2;
}

message DenyGrant {
  // @cc [owner:spolu,label:api] dfs-deny-mode
  // Mode MUST use r=4, w=2, x=1 and contain only bits in 0o7. DENY modes MUST remove these
  // inherited permissions for every subject before matching local ALLOW modes are added. They
  // MUST NOT remove permissions granted by an ALLOW at the same object. Zero MUST leave
  // permission bits unchanged. Other bits MUST fail with INVALID_INPUT.
  required uint32 mode = 1;
}

message CreateTenantRequest {
  required string tenant_id = 1;
  repeated Grant root_grants = 2;
}

message Tenant {
  required string tenant_id = 1;
  required ObjectId root_id = 2;
  required string tenant_key = 3;
}

// The tenant is derived exclusively from the authenticated tenant key.
message CreateSessionRequest {
  repeated string subjects = 1;
}

message Session {
  required string id = 1;
  required string tenant_id = 2;
  repeated string subjects = 3;
  required string session_key = 4;
  required uint64 expires_at = 5;
  required ObjectId root_id = 6;
}

// The tenant is derived exclusively from the authenticated tenant key.
message ListGrantsRequest {
  required ObjectId object_id = 1;
  optional string after = 2;
  required uint32 limit = 3;
}

message GrantPage {
  repeated Grant grants = 1;
  optional string next_after = 2;
}

// The tenant is derived exclusively from the authenticated tenant key.
message UpdateGrantsRequest {
  required ObjectId object_id = 1;
  repeated GrantUpdate changes = 2;
}

message GrantUpdate {
  required Grant grant = 1;
  // @cc [owner:spolu,label:api] dfs-grant-update-remove
  // True MUST detach the grant; false MUST attach it.
  required bool remove = 2;
}

message StatRequest {
  repeated ObjectRef object_ids = 1;
  optional bool include_metadata = 2 [default = false];
}

// @cc [owner:spolu,label:api] dfs-attr-batch-results
// Successful Stat and Lookup calls MUST return one result per input in input order. Each result
// MUST contain exactly one of object or error. Missing or inaccessible objects MUST NOT prevent
// other results. Successful results MUST carry their read view in object.view; the batch MUST NOT
// contain a separate view. Encoded batches MUST fit 4 MiB; exceeding the budget MUST fail the RPC
// with CAPACITY. Requested metadata MUST NOT be silently omitted from successful results.
message AttrBatch {
  repeated AttrResult results = 1;
}

message AttrResult {
  optional Attr object = 1;
  optional ErrorDetails error = 2;
}

message LookupRequest {
  repeated LookupTarget targets = 1;
  optional bool include_metadata = 2 [default = false];
}

message LookupTarget {
  required ObjectRef parent_id = 1;
  required string name = 2;
}

message ListRequest {
  required ObjectRef directory_id = 1;
  optional string after = 2;
  required uint32 limit = 3;
}

message EntryPage {
  repeated Entry entries = 1;
  optional string next_after = 2;
}

message Entry {
  required string name = 1;
  optional Attr object = 2;
}

message ReadRequest {
  required ObjectId object_id = 1;
  required uint64 offset = 2;
  required uint32 length = 3;
  optional uint64 content_version = 4;
}

message ReadData {
  required bytes data = 1;
  required Attr object = 2;
}

message ReadFilesRequest {
  repeated ObjectId object_ids = 1;
}

message FilesBatch {
  repeated FileResult results = 1;
  repeated ObjectId omitted_ids = 2;
}

message FileResult {
  required ObjectId object_id = 1;
  optional Attr object = 2;
  optional bytes data = 3;
  optional ErrorDetails error = 4;
}

message ValidateRequest {
  repeated VersionCheck checks = 1;
}

message VersionCheck {
  required ObjectRef object_id = 1;
  optional uint64 attr_version = 2;
  optional uint64 content_version = 3;
}

message ValidationBatch {
  repeated ValidationResult results = 1;
  required ReadView view = 2;
}

enum ValidationOutcome {
  UNCHANGED = 0;
  CHANGED = 1;
  DENIED = 2;
  MISSING = 3;
  ERROR = 4;
}

message ValidationResult {
  required ValidationOutcome outcome = 1;
  optional ErrorDetails error = 2;
}

message ApplyRequest {
  repeated Operation operations = 1;
}

message Operation {
  oneof operation {
    CreateOperation create = 1;
    UpdateOperation update = 2;
    WriteOperation write = 3;
    RenameOperation rename = 4;
    RemoveOperation remove = 5;
  }
}

message OperationBatch {
  repeated OperationResult results = 1;
}

message OperationResult {
  optional Mutation mutation = 1;
  optional ErrorDetails error = 2;
}

message Mutation {
  optional Attr object = 1;
  // @cc [owner:spolu,label:api;backend] dfs-removal-parent-attributes
  // For a successful removal, related MUST include the removed object's parent's final Attr
  // unless that parent is also removed later in the Apply batch.
  repeated Attr related = 2;
}

message CreateOperation {
  required ObjectId parent_id = 1;
  required string name = 2;
  // The caller supplies a fresh UUIDv7.
  required ObjectId object_id = 3;
  required bool directory = 4;
  optional string mime_type = 5;
  map<string, bytes> xattrs = 6;
}

message UpdateOperation {
  required ObjectId object_id = 1;
  optional string mime_type = 2;
  repeated XattrChange xattrs = 3;
  optional uint64 atime = 4;
  optional uint64 mtime = 5;
  optional uint64 size = 6;
}

message XattrChange {
  required string name = 1;
  optional bytes value = 2;
}

message WriteOperation {
  required ObjectId object_id = 1;
  required uint64 offset = 2;
  required bytes data = 3;
  required bool append = 4;
}

message RenameOperation {
  required ObjectId object_id = 1;
  required ObjectId parent_id = 2;
  required string name = 3;
  required bool replace = 4;
}

message RemoveOperation {
  required ObjectId object_id = 1;
  required bool directory = 2;
}

enum SearchField {
  NAME = 0;
  CONTENT = 1;
}

enum SearchKind {
  FILE = 0;
  DIRECTORY = 1;
}

message SearchRequest {
  required string query = 1;
  repeated SearchField fields = 2;
  optional SearchScope scope = 3;
  optional SearchFilter filter = 4;
  optional uint32 limit = 5 [default = 20];
}

message SearchScope {
  required ObjectId directory_id = 1;
  optional bool recursive = 2 [default = true];
}

message SearchFilter {
  optional SearchKind kind = 1;
  optional string name = 2;
  optional string name_prefix = 3;
  repeated string mime_types = 4;
  optional uint64 min_size = 5;
  optional uint64 max_size = 6;
  optional uint64 modified_after = 7;
  optional uint64 modified_before = 8;
  repeated SearchXattr xattrs = 9;
}

message SearchXattr {
  required string name = 1;
  optional bytes value = 2;
}

message SearchResults {
  repeated SearchHit hits = 1;
  required bool partial = 2;
}

message SearchHit {
  required Attr object = 1;
  required string name = 2;
  optional string excerpt = 3;
}

enum ErrorCode {
  INTERNAL = 0;
  INVALID_INPUT = 1;
  NOT_FOUND = 2;
  FORBIDDEN = 3;
  UNAUTHENTICATED = 4;
  ALREADY_EXISTS = 5;
  NOT_DIRECTORY = 6;
  IS_DIRECTORY = 7;
  NOT_EMPTY = 8;
  CAPACITY = 9;
  UNAVAILABLE = 10;
  UNSUPPORTED = 11;
  NAME_TOO_LONG = 12;
  STALE_VIEW = 13;
}

message ErrorDetails {
  required ErrorCode code = 1;
}
