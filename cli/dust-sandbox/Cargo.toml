[package]
name = "dust-sandbox"
version = "0.1.57"
edition = "2021"

[[bin]]
name = "dsbx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
base64 = "0.22"
bytes = "1"
h2 = "0.4"
http = "1"
libc = "0.2"
lru = "0.16"
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
# Already in the tree through rustls/rcgen; used directly for bundle hashing.
ring = "0.17"
rustix = { version = "1", features = ["process"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
time = { version = "=0.3.36", features = ["formatting"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
x509-parser = "0.16"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[dependencies.tempfile]
version = "=3.20.0"
