<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Skill Tag Explorer</title>
    <style>
      :root {
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        --ink: #23352f;
        --muted: #65736a;
        --line: #d9e0d8;
        --paper: #fff;
        --bg: #f6f7f3;
        --accent: #264c3c;
        --accent-soft: #e3ede6;
        --warn: #a8562a;
        --focus: #597cba;
        color: var(--ink);
        background: var(--bg);
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
      header {
        padding: 22px 28px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      h1 {
        font-size: 24px;
        letter-spacing: -0.6px;
        margin: 0 0 6px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 10px;
      }
      h3 {
        font-size: 13px;
        margin: 16px 0 6px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1.2px;
      }
      p {
        line-height: 1.5;
        margin: 0;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .tabs button {
        font: inherit;
        font-size: 14px;
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink);
        border-radius: 7px;
        min-height: 40px;
        padding: 8px 14px;
        cursor: pointer;
      }
      .tabs button[aria-selected="true"] {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      main {
        padding: 16px 28px 32px;
      }
      .explore {
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr) 420px;
        gap: 16px;
        align-items: start;
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        min-width: 0;
        padding: 16px 18px;
      }
      .sticky {
        position: sticky;
        top: 12px;
        max-height: calc(100vh - 24px);
        overflow: auto;
      }
      input[type="search"] {
        font: inherit;
        font-size: 15px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 9px 12px;
        min-height: 42px;
        margin-bottom: 12px;
      }
      .facet {
        margin-bottom: 14px;
      }
      .facet-title {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .tag-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .tag-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font: inherit;
        font-size: 13px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--ink);
        border-radius: 6px;
        padding: 4px 8px;
        cursor: pointer;
        text-align: left;
        width: 100%;
      }
      .tag-row:hover {
        background: var(--accent-soft);
      }
      .tag-row[aria-pressed="true"] {
        background: var(--accent);
        color: #fff;
      }
      .tag-row.empty {
        opacity: 0.4;
      }
      .tag-row .count {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        opacity: 0.8;
      }
      .results-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .skill-row {
        border-top: 1px solid var(--line);
        padding: 10px 6px;
        cursor: pointer;
        display: grid;
        gap: 4px;
      }
      .skill-row:hover,
      .skill-row[aria-selected="true"] {
        background: var(--accent-soft);
      }
      .skill-row .name {
        font-weight: 650;
        font-size: 14px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        font: inherit;
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 8px;
        background: var(--bg);
        color: var(--ink);
        cursor: pointer;
        white-space: nowrap;
      }
      .chip.primary {
        border-color: var(--accent);
      }
      .chip.shared {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .chip.facet-function { border-left: 4px solid #264c3c; }
      .chip.facet-task { border-left: 4px solid #597cba; }
      .chip.facet-subject { border-left: 4px solid #a8562a; }
      .chip.facet-output { border-left: 4px solid #8a6fb5; }
      .chip.facet-systems { border-left: 4px solid #6b8e23; }
      .chip.facet-audience { border-left: 4px solid #b0893a; }
      .chip.facet-trigger { border-left: 4px solid #4d8f8f; }
      .chip.facet-quality { border-left: 4px solid #999; }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: left;
        padding: 5px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
      }
      td.num,
      th.num {
        text-align: right;
      }
      .bar {
        display: inline-block;
        height: 8px;
        background: var(--accent);
        border-radius: 2px;
        vertical-align: middle;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .tile {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .tile .value {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.5px;
      }
      .metrics section {
        margin-bottom: 26px;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 16px;
      }
      details summary {
        cursor: pointer;
        font-size: 13px;
        color: var(--muted);
      }
      pre {
        white-space: pre-wrap;
        font-size: 12px;
        line-height: 1.45;
        background: var(--bg);
        border-radius: 8px;
        padding: 10px 12px;
        max-height: 420px;
        overflow: auto;
      }
      .neighbor {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
        padding: 6px 4px;
        border-top: 1px solid var(--line);
        cursor: pointer;
        font-size: 13px;
      }
      .neighbor:hover {
        background: var(--accent-soft);
      }
      .neighbor .score {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .mark {
        color: var(--accent);
        font-weight: 650;
      }
      .method-toggle {
        display: flex;
        gap: 6px;
        margin: 6px 0 10px;
      }
      .method-toggle button {
        font: inherit;
        font-size: 12px;
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .method-toggle button[aria-pressed="true"] {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .link {
        background: none;
        border: none;
        font: inherit;
        color: var(--accent);
        cursor: pointer;
        padding: 0;
        text-decoration: underline;
      }
      @media (max-width: 1100px) {
        .explore {
          grid-template-columns: 1fr;
        }
        .sticky {
          position: static;
          max-height: none;
        }
      }
      @media (max-width: 640px) {
        header,
        main {
          padding-left: 16px;
          padding-right: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Skill Tag Explorer</h1>
        <p class="muted" id="subtitle"></p>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-explore" aria-selected="true">Explore</button>
        <button type="button" role="tab" id="tab-metrics" aria-selected="false">Metrics</button>
      </div>
    </header>
    <main>
      <div class="explore" id="explore">
        <aside class="panel sticky" id="facets"></aside>
        <section class="panel" id="results"></section>
        <aside class="panel sticky" id="detail"></aside>
      </div>
      <div class="metrics" id="metrics" hidden></div>
    </main>
    <script>
      /*__DATA__*/
      /*__VIEWER__*/
    </script>
  </body>
</html>
