# Henry's dfs-server: one tenant (--prefix), 3 stateless replicas, one per zone, behind a public L4
# load balancer open to all: data is synthetic and mounts need the tenant token. Sandbox egress goes
# through E2B's proxy, whose source IPs we do not know. Placeholders are filled by
# impls/henry/deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfs-server
  namespace: dfs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dfs-server
  template:
    metadata:
      labels:
        app: dfs-server
    spec:
      nodeSelector:
        dfs-bench/role: server
      tolerations:
        - key: dfs-bench/role
          operator: Equal
          value: server
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: dfs-server
      # The FDB client rewrites its cluster file when coordinators change, so it gets a writable copy.
      initContainers:
        - name: cluster-file
          image: busybox:1.36
          command: ["/bin/cp", "/config/cluster-file", "/fdb/cluster-file"]
          volumeMounts:
            - { name: fdb-config, mountPath: /config }
            - { name: fdb, mountPath: /fdb }
      containers:
        - name: server
          image: __IMAGE__
          args: ["--prefix", "__PREFIX__", "serve", "--listen", "0.0.0.0:7400"]
          env:
            - { name: FDB_CLUSTER_FILE, value: /fdb/cluster-file }
            - { name: RUST_LOG, value: info }
          ports:
            - containerPort: 7400
          readinessProbe:
            tcpSocket:
              port: 7400
            periodSeconds: 5
          resources:
            requests:
              cpu: "6"
              memory: 40Gi
          volumeMounts:
            - { name: fdb, mountPath: /fdb }
      volumes:
        - name: fdb-config
          configMap:
            name: fdb-config
        - name: fdb
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dfs-server
  namespace: dfs
spec:
  type: LoadBalancer
  selector:
    app: dfs-server
  ports:
    - port: 7400
      targetPort: 7400
