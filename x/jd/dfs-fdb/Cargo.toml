[package]
name = "dfs-fdb"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
bincode = "1.3.3"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
libc = "0.2"
parking_lot = "0.12"
prost = "0.13.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
sha2 = "0.10"
thiserror = "2"
foundationdb = { version = "=0.10.0", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tonic = { version = "0.12.3", features = ["tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.16.0", default-features = false, features = ["abi-7-36"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12.3"

[dev-dependencies]
libtest-mimic = "0.8"
tempfile = "3"

[profile.release]
debug = 1

[[test]]
name = "frontend"
harness = false

[[test]]
name = "indexing"
harness = false

[[test]]
name = "storage"
harness = false

[[test]]
name = "search"
harness = false

[[test]]
name = "engine"
harness = false

[[test]]
name = "buffered"
harness = false

[[test]]
name = "import"
harness = false
