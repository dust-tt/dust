name: dfs-v2-gcp
services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    volumes:
      - /var/lib/dfs-es:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 5s
      timeout: 6s
      retries: 60
  dev:
    build:
      context: ../local
    network_mode: host
    environment:
      FDB_CLUSTER_FILE: /etc/dfs-fdb/fdb.cluster
      DFS_FDB_CLUSTER_FILE: /etc/dfs-fdb/fdb.cluster
      DFS_ES_URL: http://127.0.0.1:9200
      DFS_FDB_PREFIX: dfs-v2-gcp
      DFS_ES_INDEX: dfs-v2-gcp
      DFS_FDB_GRV_BATCH_TIMEOUT_SECONDS: "0.005"
      DFS_FDB_CLIENT_BUSY_WAIT_SECONDS: "0"
      DFS_FDB_COMMIT_BATCH_MIN_SECONDS: "0.001"
      DFS_FDB_COMMIT_BATCH_IDLE_SECONDS: "0.0005"
      DFS_FDB_SERVER_BUSY_WAIT_SECONDS: "0"
      CARGO_TARGET_DIR: /target
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTC_WRAPPER: ""
    volumes:
      - /opt/dfs:/dfs
      - /etc/dfs-fdb:/etc/dfs-fdb:ro
      - /target:/target
      - /benchmark:/benchmark:ro
      - /var/log/dfs-bench:/reports
      - cargo:/usr/local/cargo/registry
    devices:
      - /dev/fuse:/dev/fuse
    cap_add: [SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    command: ["sleep", "infinity"]
    init: true
volumes:
  cargo:
