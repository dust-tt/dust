name: dfs-v2
services:
  fdb:
    image: foundationdb/foundationdb:7.3.69
    entrypoint: ["/usr/bin/tini", "-g", "--", "/bin/bash", "/etc/dfs/fdb.bash"]
    environment:
      FDB_NETWORKING_MODE: container
      DFS_FDB_COMMIT_BATCH_MIN_SECONDS: ${DFS_FDB_COMMIT_BATCH_MIN_SECONDS:-0.00001}
      DFS_FDB_COMMIT_BATCH_IDLE_SECONDS: ${DFS_FDB_COMMIT_BATCH_IDLE_SECONDS:-0.00001}
      DFS_FDB_SERVER_BUSY_WAIT_SECONDS: ${DFS_FDB_SERVER_BUSY_WAIT_SECONDS:-0.0001}
    volumes:
      - fdb-data:/var/fdb
      - ./fdb.bash:/etc/dfs/fdb.bash:ro
    mem_limit: ${DFS_V2_FDB_MEMORY:-3g}
    healthcheck:
      test: ["CMD-SHELL", "fdbcli --exec 'status minimal' --timeout 5 | grep -q 'The database is available'"]
      interval: 2s
      timeout: 6s
      retries: 60
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${DFS_V2_ES_JAVA_OPTS:--Xms1g -Xmx1g}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:${DFS_V2_ES_PORT:-19202}:9200"
    mem_limit: ${DFS_V2_ES_MEMORY:-3g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 60
  dev:
    build:
      context: .
    ports:
      - "127.0.0.1:${DFS_V2_PORT:-18082}:8080"
    environment:
      FDB_CLUSTER_FILE: /var/fdb/fdb.cluster
      DFS_FDB_CLUSTER_FILE: /var/fdb/fdb.cluster
      DFS_FDB_PREFIX: dfs-v2-local
      DFS_ES_URL: http://es:9200
      DFS_ES_INDEX: dfs-v2-local
      RUSTC_WRAPPER: ""
      CARGO_TARGET_DIR: /target
      CARGO_PROFILE_DEV_DEBUG: "0"
      DFS_FDB_GRV_BATCH_TIMEOUT_SECONDS: ${DFS_FDB_GRV_BATCH_TIMEOUT_SECONDS:-0.005}
      DFS_FDB_CLIENT_BUSY_WAIT_SECONDS: ${DFS_FDB_CLIENT_BUSY_WAIT_SECONDS:-0.0001}
      DFS_FDB_COMMIT_BATCH_MIN_SECONDS: ${DFS_FDB_COMMIT_BATCH_MIN_SECONDS:-0.00001}
      DFS_FDB_COMMIT_BATCH_IDLE_SECONDS: ${DFS_FDB_COMMIT_BATCH_IDLE_SECONDS:-0.00001}
      DFS_FDB_SERVER_BUSY_WAIT_SECONDS: ${DFS_FDB_SERVER_BUSY_WAIT_SECONDS:-0.0001}
    volumes:
      - ../..:/dfs
      - ../../../../jd/filesystem-benchmark:/benchmark:ro
      - fdb-data:/var/fdb:ro
      - target:/target
      - cargo:/usr/local/cargo/registry
    devices:
      - /dev/fuse:/dev/fuse
    cap_add: [SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    command: ["sleep", "infinity"]
    init: true
    depends_on:
      fdb:
        condition: service_healthy
      es:
        condition: service_healthy
volumes:
  fdb-data:
    name: dfs-v2-foundationdb
  es-data:
  target:
  cargo:
