[package]
name = "dfs-server"
version = "0.2.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dfs-protocol = { path = "../protocol" }
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
slatedb = { version = "=0.17.0", default-features = false, features = ["gcp", "foyer"] }
subtle = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tower = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[lints]
workspace = true
