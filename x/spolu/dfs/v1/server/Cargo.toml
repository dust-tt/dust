[package]
name = "dfs-server"
version = "0.2.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
foyer = { version = "0.22.6", features = ["serde"] }
lance-core = "=12.0.0"
lance-io = { version = "=12.0.0", default-features = false }
moka = { version = "0.12", features = ["sync"] }
object_store = "0.14.2"
url = "2"
arrow-array = "58"
arrow-schema = "58"
base64 = "0.22"
lancedb = { version = "=0.39.0", default-features = false, features = ["gcs", "remote"] }
clap = { version = "4", features = ["derive", "env"] }
dfs-protocol = { path = "../protocol" }
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
slatedb = { version = "=0.17.0", default-features = false, features = ["gcp", "foyer"] }
subtle = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tower = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
dfs-client = { path = "../client" }
tempfile = "3"
serde_json = "1"

[lints]
workspace = true
