openapi: 3.0.3
info:
  title: dfs server
  version: 0.1.0
  description: |
    Unknown routes return 404 with ErrorResponse (not_found). Unsupported methods on known routes
    return 405 with ErrorResponse (method_not_allowed) and an Allow header.
    Errors carry Cache-Control: no-store. HEAD responses omit the body.
    JSON requests accept at most 64 KiB. Malformed JSON, unknown fields, and
    oversized bodies return invalid_input (400). All authenticated responses disable caching.
    Missing and inaccessible objects
    produce the same not_found response; messages never contain resource or storage details.
paths:
  /health:
    get:
      operationId: health
      summary: Check that the HTTP server is running.
      description: Liveness only; does not check storage or filesystem readiness.
      security: []
      responses:
        "200":
          description: The HTTP server is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
    head:
      operationId: healthHead
      summary: Check liveness without a response body.
      security: []
      responses:
        "200":
          description: The HTTP server is running; no response body.
  /workspaces:
    post:
      operationId: createWorkspace
      summary: Create a workspace and return its key once.
      description: |
        Requires DFS_SERVER_KEY in Authorization. If workspace creation is disabled (no configured
        server key) or storage is unavailable, returns unavailable (503). The workspace record,
        root, explicit root grants, and initial event are persisted atomically before returning.
        An existing workspace returns conflict (409) without replacing its root or key.
        Initial root grants default to empty and apply to descendants through inheritance.
        The workspace key can mint any grant set within this workspace; keep it with trusted callers.
        Only its hash is stored. A lost response may leave a created workspace whose key cannot be
        recovered; key rotation is future work. Do not assume a failed request was uncommitted.
      security:
        - ServerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        "201":
          description: Workspace persisted; save its key from this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkspaceResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /sessions:
    post:
      operationId: createSession
      summary: Exchange a workspace key for a session with fixed grants.
      description: |
        The workspace key must match workspace_id. Wrong keys, missing workspaces, and keys from
        another workspace all return unauthenticated (401). Server and session keys are not accepted.
        Grants are opaque; deduplicate before enforcing the limit of 512 distinct grants. Empty
        sets and empty grant strings are allowed. Creating a session never attaches grants to objects.
        Nonempty mounts return unsupported (501) until mount validation is implemented.
        Sessions expire after one hour, on explicit closure, or on server restart. A process supports
        at most 10000 live sessions (capacity_exhausted, 507). Expired entries are cleaned on access.
      security:
        - WorkspaceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        "201":
          description: Session created; its key is returned only here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /sessions/current:
    get:
      operationId: currentSession
      summary: Read the authenticated session's workspace, grants, and expiry.
      security:
        - SessionKey: []
      responses:
        "200":
          description: The session is valid; credentials are never echoed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        default:
          $ref: '#/components/responses/ApiError'
    head:
      operationId: currentSessionHead
      summary: Check session validity without a response body.
      security:
        - SessionKey: []
      responses:
        "200":
          description: The session is valid; no response body.
        default:
          $ref: '#/components/responses/ApiError'
  /sessions/{session_id}:
    delete:
      operationId: closeSession
      summary: Close the session authenticated by its own key.
      description: |
        A key cannot close another session (not_found, 404). Closed, expired, and unknown keys return
        unauthenticated (401). The session ID is not a credential.
      security:
        - SessionKey: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session closed; no response body.
        default:
          $ref: '#/components/responses/ApiError'
  /objects/stat:
    post:
      operationId: statObject
      summary: Read an authorized object's attributes by stable ID.
      description: |
        Authorization uses explicit grants on the object or its current ancestors within the
        session's workspace. Missing, cross-workspace, and inaccessible objects return not_found
        (404). A directly shared object is accessible without granting access to its ancestors.
        Metadata and authorization use one fresh snapshot. Responses omit parent links, names,
        paths, and grants. In-flight reads may finish against their original snapshot.
      security:
        - SessionKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatRequest'
      responses:
        "200":
          description: Current authorized attributes; Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectAttributes'
        default:
          $ref: '#/components/responses/ApiError'
  /objects/lookup:
    post:
      operationId: lookupObject
      summary: Look up one named child of an authorized directory.
      description: |
        Requires access to the parent directory. Sharing the child alone does not permit lookup
        through an inaccessible parent; use stat by ID instead. Names are exact case-sensitive
        UTF-8 components, never paths. An authorized file used as parent returns not_directory
        (400); missing/inaccessible parents or missing names return not_found (404).
        Entry, attributes, and authorization use one snapshot. Names stay in JSON bodies.
      security:
        - SessionKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupRequest'
      responses:
        "200":
          description: Child attributes; Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectAttributes'
        default:
          $ref: '#/components/responses/ApiError'
  /objects/list:
    post:
      operationId: listObjects
      summary: List an authorized directory with attributes for each entry.
      description: |
        Requires access to the directory; children inherit that access. An authorized file returns
        not_directory (400); missing/inaccessible objects return not_found (404). Each page reads
        entries, attributes, and continuation from one snapshot in exact UTF-8 name-byte order.
        Pass next_after verbatim as after in the next request. Null next_after means this page
        reached the end of its snapshot. Each page reauthorizes against a fresh snapshot; cursors
        neither preserve access rights nor retain a listing snapshot. Concurrent edits can cause
        skips/repeats across pages; restart traversal when necessary. Cursors stay in JSON bodies.
      security:
        - SessionKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListRequest'
      responses:
        "200":
          description: Authorized directory page; Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /objects/mkdir:
    post:
      operationId: createDirectory
      summary: Create a directory under an authorized parent.
      description: |
        Requires the session's current grants to authorize the parent. The directory, child entry,
        parent revision/mtime/ctime, and indexing event persist atomically before returning.
        Access is inherited; session grants are never attached to the new directory. Existing names
        return already_exists (409); an authorized file parent returns not_directory (400).
        Creation generates a fresh ID, revision zero, and equal server atime/mtime/ctime.
        Failure after submission can have an ambiguous outcome; look up the name before retrying.
      security:
        - SessionKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MkdirRequest'
      responses:
        "201":
          description: Directory persisted; attributes use Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectAttributes'
        default:
          $ref: '#/components/responses/ApiError'
  /objects/update:
    post:
      operationId: updateMetadata
      summary: Update an authorized file or directory's metadata.
      description: |
        Requires current grants and expected_metadata_revision. Authorization, revision comparison,
        and publication are serialized; stale revisions return conflict (409) without a mutation.
        Only supplied fields change. Omitted/null scalar fields are unchanged; xattr null values
        remove keys and empty base64 strings store empty bytes. Require at least one supplied scalar
        or xattr entry. Every accepted update increments the revision and sets server ctime,
        preserving identity, parent, content reference, and grants. Reads never change atime.
        Metadata and the indexing event must be durable before returning. A failed/disconnected
        request may already have committed; re-read attributes to resolve an ambiguous outcome.
      security:
        - SessionKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetadataRequest'
      responses:
        "200":
          description: Updated attributes persisted; Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectAttributes'
        default:
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    ServerKey:
      type: http
      scheme: bearer
      description: Operator-configured DFS_SERVER_KEY; used only for workspace creation.
    WorkspaceKey:
      type: http
      scheme: bearer
      description: Workspace key returned by POST /workspaces; used to create sessions.
    SessionKey:
      type: http
      scheme: bearer
      description: Session key returned by POST /sessions; fixes the workspace and grants.
  responses:
    ApiError:
      description: |
        Shared error envelope. Requests may fail with invalid_input/name_too_long/not_directory (400), unauthenticated (401),
        not_found (404), conflict/already_exists (409), internal (500), unsupported (501), unavailable (503), or
        capacity_exhausted (507). Credentials and resource/storage details are never included.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        WWW-Authenticate:
          description: Present on unauthenticated responses.
          schema:
            type: string
            enum: [Bearer]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ObjectId:
      type: string
      pattern: '^[0-9a-f]{32}$'
      description: Stable object UUID, encoded as 32 lowercase hexadecimal characters.
    EntryName:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        One exact UTF-8 component, 1–255 bytes; no slash or NUL, and not '.' or '..'. Preserve
        case and Unicode without normalization. Oversized names return name_too_long (400).
    StatRequest:
      type: object
      additionalProperties: false
      required: [object_id]
      properties:
        object_id:
          $ref: '#/components/schemas/ObjectId'
    LookupRequest:
      type: object
      additionalProperties: false
      required: [parent_id, name]
      properties:
        parent_id:
          $ref: '#/components/schemas/ObjectId'
        name:
          $ref: '#/components/schemas/EntryName'
    ListRequest:
      type: object
      additionalProperties: false
      required: [directory_id]
      properties:
        directory_id:
          $ref: '#/components/schemas/ObjectId'
        after:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          description: Exclusive EntryName cursor, or omit/null to start from the beginning.
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
    Timestamp:
      type: object
      additionalProperties: false
      required: [seconds, nanoseconds]
      properties:
        seconds:
          type: integer
          format: int64
          description: Signed Unix seconds; negative values are allowed.
        nanoseconds:
          type: integer
          minimum: 0
          maximum: 999999999
    MkdirRequest:
      type: object
      additionalProperties: false
      required: [parent_id, name]
      properties:
        parent_id:
          $ref: '#/components/schemas/ObjectId'
        name:
          $ref: '#/components/schemas/EntryName'
        mime_type:
          type: string
          nullable: true
          default: inode/directory
          description: Valid MIME type; omitted/null uses inode/directory.
        mode:
          type: integer
          nullable: true
          minimum: 0
          maximum: 511
          default: 493
          description: Low nine bits (0755 default); caller applies umask. Extra bits return unsupported.
        xattrs:
          type: object
          default: {}
          additionalProperties:
            type: string
            format: byte
          description: |
            Nonempty UTF-8 keys without NUL and standard padded base64 values. Sum of UTF-8 key
            bytes and decoded value bytes must fit 32 KiB per object (capacity_exhausted, 507).
    UpdateMetadataRequest:
      type: object
      additionalProperties: false
      required: [object_id, expected_metadata_revision]
      properties:
        object_id:
          $ref: '#/components/schemas/ObjectId'
        expected_metadata_revision:
          type: integer
          minimum: 0
          description: Required unsigned 64-bit revision from this object's attributes in this session.
        mime_type:
          type: string
          nullable: true
          description: Valid MIME type; omitted/null leaves unchanged.
        mode:
          type: integer
          nullable: true
          minimum: 0
          maximum: 511
          description: Low nine permission bits; extra bits return unsupported (501). Grants authorize access.
        atime:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        mtime:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        xattrs:
          type: object
          default: {}
          additionalProperties:
            type: string
            format: byte
            nullable: true
          description: |
            Patch with nonempty UTF-8 keys without NUL. Standard padded base64 replaces a value,
            null removes a key (absent keys are harmless), and omitted keys are unchanged.
            Resulting total of key bytes plus decoded value bytes must fit 32 KiB (507 otherwise).
    ObjectAttributes:
      type: object
      additionalProperties: false
      required: [object_id, kind, mime_type, xattrs, metadata_revision, mode, atime, mtime, ctime]
      description: |
        Persisted attributes only. content_version and size_bytes are present for files and absent
        for directories. Modes contain the low nine permission bits and do not grant server access.
        Parent links, names, paths, and grants are omitted. Revisions are meaningful only within the current
        session, workspace, and object; session recreation discards cached state.
      properties:
        object_id:
          $ref: '#/components/schemas/ObjectId'
        kind:
          type: string
          enum: [file, directory]
        mime_type:
          type: string
        xattrs:
          type: object
          additionalProperties:
            type: string
            format: byte
          description: Opaque xattr values encoded as standard padded base64.
        metadata_revision:
          type: integer
          minimum: 0
          description: Unsigned 64-bit metadata counter; clients must preserve its full precision.
        mode:
          type: integer
          minimum: 0
          maximum: 511
        atime:
          $ref: '#/components/schemas/Timestamp'
        mtime:
          $ref: '#/components/schemas/Timestamp'
        ctime:
          $ref: '#/components/schemas/Timestamp'
        content_version:
          type: string
          pattern: '^[0-9a-f]{32}$'
        size_bytes:
          type: integer
          minimum: 0
          description: Unsigned 64-bit file length; clients must preserve its full precision.
    ListResponse:
      type: object
      additionalProperties: false
      required: [entries, next_after]
      properties:
        entries:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [name, attributes]
            properties:
              name:
                $ref: '#/components/schemas/EntryName'
              attributes:
                $ref: '#/components/schemas/ObjectAttributes'
        next_after:
          type: string
          nullable: true
          description: Last returned name when more entries exist in this snapshot; otherwise null.
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
          minLength: 1
          description: Caller-provided, opaque, case-sensitive workspace identifier.
        root_grants:
          type: array
          default: []
          description: At most 512 distinct opaque strings; duplicates are deduplicated.
          items:
            type: string
    CreateWorkspaceResponse:
      type: object
      additionalProperties: false
      required: [workspace_id, root_id, workspace_key]
      properties:
        workspace_id:
          type: string
        root_id:
          type: string
          pattern: '^[0-9a-f]{32}$'
        workspace_key:
          type: string
          pattern: '^dfsw_[0-9a-f]{64}$'
          description: Secret returned once; 256 random bits. Never send in a URL.
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, grants]
      properties:
        workspace_id:
          type: string
          minLength: 1
        grants:
          type: array
          description: At most 512 distinct opaque strings; duplicates are deduplicated.
          items:
            type: string
        mounts:
          type: object
          default: {}
          description: Only an empty map is supported in this increment.
          additionalProperties:
            type: string
    SessionResponse:
      type: object
      required: [session_id, workspace_id, grants, expires_at]
      properties:
        session_id:
          type: string
          pattern: '^[0-9a-f]{32}$'
        workspace_id:
          type: string
        grants:
          type: array
          uniqueItems: true
          maxItems: 512
          items:
            type: string
        expires_at:
          type: integer
          format: int64
          description: Expiration time in Unix seconds; not extended by requests.
    CreateSessionResponse:
      allOf:
        - $ref: '#/components/schemas/SessionResponse'
        - type: object
          required: [session_key]
          properties:
            session_key:
              type: string
              pattern: '^dfss_[0-9a-f]{64}$'
              description: Secret returned once; 256 random bits. Never send in a URL.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                invalid_input, name_too_long, and not_directory (400), unauthenticated (401), forbidden (403),
                not_found (404), method_not_allowed (405), conflict/already_exists (409), internal (500),
                unsupported (501), unavailable (503), capacity_exhausted (507).
                Unauthenticated responses include WWW-Authenticate: Bearer.
                Clients branch on codes, not messages, and must handle unknown codes.
              enum:
                - invalid_input
                - name_too_long
                - unauthenticated
                - forbidden
                - not_found
                - not_directory
                - method_not_allowed
                - conflict
                - already_exists
                - internal
                - unsupported
                - unavailable
                - capacity_exhausted
            message:
              type: string
              description: Fixed public text; contains no request or storage details.
      example:
        error:
          code: not_found
          message: Not found.
