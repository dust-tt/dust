services:
  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    volumes:
      - pgsql:/var/lib/postgresql/data
    ports:
      - 5432:5432
  qdrant_primary:
    image: "qdrant/qdrant:v1.18.3"
    volumes:
      - qdrant_primary:/qdrant/storage
    ports:
      - "6334:6334"
      - "6333:6333"
    environment:
      QDRANT__CLUSTER__ENABLED: "true"
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    command: ["./qdrant", "--uri", "http://qdrant_primary:6335"]
    healthcheck:
      test: ["CMD", "sleep", "5"] # Hack: `curl` not accessible in qdrant image, sleep for 5 seconds.
      interval: 1s
      timeout: 10s
      retries: 1 # Only retry once to minimize delay
  qdrant_secondary:
    image: "qdrant/qdrant:v1.18.3"
    volumes:
      - qdrant_secondary:/qdrant/storage
    environment:
      QDRANT__CLUSTER__ENABLED: "true"
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    command: ["./qdrant", "--bootstrap", "http://qdrant_primary:6335", "--uri", "http://qdrant_secondary:6335"]
    depends_on:
      qdrant_primary:
        condition: service_healthy # Ensure qdrant is healthy before starting qdrant_primary.
  redis:
    image: redis
    ports:
      - 6379:6379
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lfu
  apache-tika:
    image: apache/tika:3.2.3.0-full
    ports:
      - "9998:9998"
    volumes:
      - ./tika-config.xml:/tika-config.xml:ro
    command: ["-c", "/tika-config.xml"]
  elasticsearch:
    build:
      context: .
      dockerfile: elasticsearch.Dockerfile
      network: host
      args:
        ES_VERSION: ${ES_LOCAL_VERSION}
    container_name: ${ES_LOCAL_CONTAINER_NAME}
    volumes:
      - dev-elasticsearch:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - xpack.ml.use_auto_machine_memory_percent=true
      - ES_JAVA_OPTS=-Xms${ES_LOCAL_HEAP_INIT} -Xmx${ES_LOCAL_HEAP_MAX}
      - action.auto_create_index=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --output /dev/null --silent --head --fail -u elastic:${ELASTICSEARCH_PASSWORD} http://elasticsearch:${ES_LOCAL_PORT}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  kibana_settings:
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_LOCAL_VERSION}
    container_name: kibana_settings
    restart: "no"
    command: >
      bash -c '
        echo "Setup the kibana_system password";
        until curl -s -u "elastic:${ELASTICSEARCH_PASSWORD}" -X POST http://elasticsearch:${ES_LOCAL_PORT}/_security/user/kibana_system/_password -d "{\"password\":\"'${KIBANA_LOCAL_PASSWORD}'\"}" -H "Content-Type: application/json" | grep -q "^{}"; do sleep 5; done;
      '

  kibana:
    depends_on:
      kibana_settings:
        condition: service_completed_successfully
    image: docker.elastic.co/kibana/kibana:${ES_LOCAL_VERSION}
    container_name: ${KIBANA_LOCAL_CONTAINER_NAME}
    volumes:
      - dev-kibana:/usr/share/kibana/data
    ports:
      - 127.0.0.1:${KIBANA_LOCAL_PORT}:5601
    environment:
      - SERVER_NAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_LOCAL_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - ELASTICSEARCH_PUBLICBASEURL=http://localhost:${ES_LOCAL_PORT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://kibana:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 20

  fdb:
    image: foundationdb/foundationdb:7.3.69
    environment:
      # Host mode: the cluster file advertises 127.0.0.1:4500, reachable through the published port.
      FDB_NETWORKING_MODE: host
      FDB_PORT: "4500"
    ports:
      - 127.0.0.1:4500:4500
    volumes:
      # The image declares /var/fdb/data as a VOLUME: mount it explicitly or data is lost on recreate.
      - dev-fdb:/var/fdb/data
    healthcheck:
      test: ["CMD-SHELL", "fdbcli --exec 'status minimal' --timeout 5 | grep -q 'The database is available'"]
      interval: 5s
      timeout: 6s
      retries: 20

  fdb_init:
    depends_on:
      - fdb
    image: foundationdb/foundationdb:7.3.69
    network_mode: service:fdb
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        echo "docker:docker@127.0.0.1:4500" > /tmp/fdb.cluster
        until fdbcli -C /tmp/fdb.cluster --timeout 5 --exec "status minimal" | grep -q "The database is available"; do
          fdbcli -C /tmp/fdb.cluster --timeout 5 --exec "configure new single ssd"
          sleep 2
        done

  gotenberg:
    image: gotenberg/gotenberg:8
    profiles:
      - gotenberg
    ports:
      - "3100:3000"
    command:
      - gotenberg
      - --chromium-disable-javascript=false
      - --chromium-allow-list=.*
      - --chromium-deny-list=

volumes:
  pgsql:
  qdrant_primary:
  qdrant_secondary:
  dev-elasticsearch:
  dev-kibana:
  dev-fdb:
