name: "Build Docker Image"
description: "Builds a Docker image using Cloud Build"

inputs:
  project_id:
    description: "Google Cloud project ID"
    required: true
  region:
    description: "Region to build in"
    required: true
  component:
    description: "Component name"
    required: true
  workload_identity_provider:
    description: "Workload Identity Provider"
    required: true
  depot_eu_project_id:
    description: "EU Depot project ID"
    required: false
  depot_eu_token:
    description: "EU Depot token"
    required: false
  depot_us_project_id:
    description: "US Depot project ID"
    required: true
  depot_us_token:
    description: "US Depot token"
    required: true
  dd_api_key:
    description: "Datadog api key"
    required: false
  dd_client_token:
    description: "Datadog client token"
    required: false
  commit_sha:
    description: "Commit SHA"
    required: true
  commit_sha_long:
    description: "Commit SHA long"
    required: false
  virtuoso_license_key:
    description: "Virtuoso license key"
    required: false
  depot_region:
    description: "Depot region"
    required: false
    default: "us"
  contentful_space_id:
    description: "Contentful space ID"
    required: false
  contentful_access_token:
    description: "Contentful access token"
    required: false
  extra_image_registries:
    description: "Space-separated <host>/<project>/<repo> prefixes that also receive the image, on top of the primary registry"
    required: false
    default: ""

outputs:
  current_version:
    description: "Previously deployed version"
    value: ${{ steps.current_version.outputs.current_tag }}
  commit_diff:
    description: "Commit diff between versions"
    value: ${{ steps.commit_info.outputs.commits }}
  commit_count:
    description: "Number of commits in diff"
    value: ${{ steps.commit_info.outputs.commit_count }}

runs:
  using: "composite"
  steps:
    - id: "auth"
      name: "Authenticate to Google Cloud"
      uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # v3.0.0
      with:
        create_credentials_file: true
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: "github-build-invoker@${{ inputs.project_id }}.iam.gserviceaccount.com"

    - name: "Configure GCP Artifact Auth"
      uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1
      with:
        install_components: "docker-credential-gcr"

    - name: "Configure GCP Docker Auth"
      shell: bash
      env:
        EXTRA_IMAGE_REGISTRIES: ${{ inputs.extra_image_registries }}
      run: |
        HOSTS="${{ inputs.region }}-docker.pkg.dev"
        # shellcheck disable=SC2086 # word splitting is the point
        for registry in $EXTRA_IMAGE_REGISTRIES; do
          HOSTS="${HOSTS},${registry%%/*}"
        done
        HOSTS=$(echo "$HOSTS" | tr ',' '\n' | sort -u | paste -sd, -)
        gcloud auth configure-docker "$HOSTS" --quiet

    - name: "Fetch custom models config"
      if: contains(inputs.component, 'front')
      shell: bash
      run: |
        gcloud storage cp gs://bkt-dust-infra-model-configs/custom.json front/custom-models.json 2>/dev/null || echo '{"models":[]}' > front/custom-models.json

    - name: "Setup Depot"
      uses: "depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461" # v1.7.1

    - name: "Build and Push"
      shell: bash
      env:
        DEPOT_TOKEN: ${{ inputs.depot_region == 'eu' && inputs.depot_eu_token || inputs.depot_us_token }}
        EXTRA_IMAGE_REGISTRIES: ${{ inputs.extra_image_registries }}
      run: |
        COMPONENT="${{ inputs.component }}"

        # Set depot project ID based on region
        if [[ "${{ inputs.depot_region }}" == "us" ]]; then
          DEPOT_PROJECT_ID="${{ inputs.depot_us_project_id }}"
        else
          DEPOT_PROJECT_ID="${{ inputs.depot_eu_project_id }}"
        fi

        # Determine environment and base component name
        if [[ ${COMPONENT} == *"-qa" ]]; then
          ENV="qa"
          BASE_COMPONENT=${COMPONENT%-qa}
        elif [[ ${COMPONENT} == *"-edge" ]]; then
          ENV="edge"
          BASE_COMPONENT=${COMPONENT%-edge}
        else
          ENV="prod"
          BASE_COMPONENT=${COMPONENT}
        fi

        CONFIG_FILE=".github/configs/${{ inputs.region }}/.env.${ENV}"

        build_args=()
        while IFS='=' read -r key value; do
          [[ -n "$key" ]] && build_args+=("--build-arg" "$(echo "$key" | xargs)=$(echo "$value" | xargs)")
        done < "$CONFIG_FILE"
        # Handle the last line if file doesn't end with newline
        [[ -n "$key" ]] && build_args+=("--build-arg" "$(echo "$key" | xargs)=$(echo "$value" | xargs)")

        # Only set the Virtuoso license key if provided
        if [[ -n "${{ inputs.virtuoso_license_key }}" ]]; then
          build_args+=("--build-arg NEXT_PUBLIC_VIRTUOSO_LICENSE_KEY=${{ inputs.virtuoso_license_key }}")
        fi

        # Only set the Datadog API key if provided
        if [[ -n "${{ inputs.dd_api_key }}" ]]; then
          build_args+=("--build-arg DATADOG_API_KEY=${{ inputs.dd_api_key }}")
        fi

        # Set the Datadog client token + service name for any front / front-edge build,
        if [[ "$BASE_COMPONENT" == "front" || "$BASE_COMPONENT" == "front-edge" ]]; then
          build_args+=("--build-arg NEXT_PUBLIC_DATADOG_CLIENT_TOKEN=${{ inputs.dd_client_token }}")
          build_args+=("--build-arg NEXT_PUBLIC_DATADOG_SERVICE=$BASE_COMPONENT")
          build_args+=("--build-arg NEXT_PUBLIC_BUILD_DATE=$(date +%s)")
          # Upload source maps for front-sse too (same image, different DD service name)
          if [[ "$BASE_COMPONENT" == "front" ]]; then
            build_args+=("--build-arg DATADOG_ADDITIONAL_SERVICES=front-sse")
          fi
        fi

        # Only set Contentful credentials for front and front-edge builds (needed for ISR),
        # and for marketing / marketing-edge (which currently builds from front/ and renders
        # the same Contentful-backed pages).
        if [[ "$COMPONENT" == "front" || "$COMPONENT" == "front-edge" || "$COMPONENT" == "marketing" || "$COMPONENT" == "marketing-edge" ]]; then
          if [[ -n "${{ inputs.contentful_space_id }}" ]]; then
            build_args+=("--build-arg CONTENTFUL_SPACE_ID=${{ inputs.contentful_space_id }}")
          fi
          if [[ -n "${{ inputs.contentful_access_token }}" ]]; then
            build_args+=("--build-arg CONTENTFUL_ACCESS_TOKEN=${{ inputs.contentful_access_token }}")
          fi
        fi

        # Override NEXT_PUBLIC_DUST_APP_URL for *-edge components (the .env.edge
        # files don't set it; only .env.prod does). marketing-edge needs it for
        # the same reason as front-edge: `next build` inlines it into the
        # client bundle at compile time.
        # Apply the same sanitization Cloudflare Pages uses for branch aliases:
        # lowercase, replace non-alphanumeric with '-', collapse multiple '-', trim '-', truncate to 28 chars.
        if [[ "$COMPONENT" == "front-edge" || "$COMPONENT" == "marketing-edge" ]]; then
          CF_BRANCH=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-//; s/-$//' | cut -c1-28 | sed 's/-$//')
          echo "🏗️ Setting build arg NEXT_PUBLIC_DUST_APP_URL=https://${CF_BRANCH}--app.preview.dust.tt"
          build_args+=("--build-arg NEXT_PUBLIC_DUST_APP_URL=https://${CF_BRANCH}--app.preview.dust.tt")
        fi

        # Tag with latest for main branch prod builds
        LATEST_TAGS=()
        PUSH_LATEST=false
        if [[ "$ENV" == "prod" && "$COMPONENT" == "$BASE_COMPONENT" && "${{ github.ref_name }}" == "main" ]]; then
          PUSH_LATEST=true
          REGISTRY="${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/dust-images"
          LATEST_TAGS+=("-t" "${REGISTRY}/${COMPONENT}:latest")
        fi

        # Same image, additional registries.
        EXTRA_TAGS=()
        # shellcheck disable=SC2086 # word splitting is the point
        for registry in $EXTRA_IMAGE_REGISTRIES; do
          EXTRA_TAGS+=("-t" "${registry}/${COMPONENT}:${{ inputs.commit_sha }}")
          if [[ "$PUSH_LATEST" == "true" ]]; then
            EXTRA_TAGS+=("-t" "${registry}/${COMPONENT}:latest")
          fi
        done

        # Special handling for front component: Bake builds both targets in parallel
        # and deduplicates work in their shared base-deps stage.
        if [[ "$BASE_COMPONENT" == "front" ]]; then
          echo "🏗️ Building front component with Bake (workers + front-api)"

          # Insert `-api` after the base component so the prod image is `front-api`
          # and the edge image is `front-api-edge` (parallel to `front`/`front-edge`).
          API_COMPONENT="${BASE_COMPONENT}-api${COMPONENT#${BASE_COMPONENT}}"

          WORKERS_IMAGE_TAG="${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/dust-images/${COMPONENT}-workers:${{ inputs.commit_sha }}"
          FRONT_API_IMAGE_TAG="${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/dust-images/${API_COMPONENT}:${{ inputs.commit_sha }}"
          WORKERS_LATEST_IMAGE_TAG=""
          FRONT_API_LATEST_IMAGE_TAG=""
          WORKERS_EXTRA_TAGS=""
          FRONT_API_EXTRA_TAGS=""
          # shellcheck disable=SC2086 # word splitting is the point
          for registry in $EXTRA_IMAGE_REGISTRIES; do
            WORKERS_EXTRA_TAGS+="${WORKERS_EXTRA_TAGS:+,}${registry}/${COMPONENT}-workers:${{ inputs.commit_sha }}"
            FRONT_API_EXTRA_TAGS+="${FRONT_API_EXTRA_TAGS:+,}${registry}/${API_COMPONENT}:${{ inputs.commit_sha }}"
            if [[ "$PUSH_LATEST" == "true" ]]; then
              WORKERS_EXTRA_TAGS+=",${registry}/${COMPONENT}-workers:latest"
              FRONT_API_EXTRA_TAGS+=",${registry}/${API_COMPONENT}:latest"
            fi
          done

          BAKE_OVERRIDES=(
            --set "*.args.COMMIT_HASH=${{ inputs.commit_sha }}"
            --set "*.args.COMMIT_HASH_LONG=${{ inputs.commit_sha_long }}"
            --set "*.args.DD_GIT_REPOSITORY_URL=https://github.com/dust-tt/dust"
            --set "*.args.DD_GIT_COMMIT_SHA=${{ inputs.commit_sha_long }}"
          )

          # Convert the build arguments collected above to Bake target overrides.
          for ((i = 1; i < ${#build_args[@]}; i += 2)); do
            BAKE_OVERRIDES+=(--set "*.args.${build_args[$i]}")
          done

          if [[ "$ENV" == "prod" && "$COMPONENT" == "$BASE_COMPONENT" && "${{ github.ref_name }}" == "main" ]]; then
            WORKERS_LATEST_IMAGE_TAG="${REGISTRY}/${COMPONENT}-workers:latest"
            FRONT_API_LATEST_IMAGE_TAG="${REGISTRY}/${API_COMPONENT}:latest"
          fi

          export WORKERS_IMAGE_TAG FRONT_API_IMAGE_TAG
          export WORKERS_LATEST_IMAGE_TAG FRONT_API_LATEST_IMAGE_TAG
          export WORKERS_EXTRA_TAGS FRONT_API_EXTRA_TAGS

          FRONT_BUILD_STARTED_SECONDS=$SECONDS
          depot bake \
            --project "$DEPOT_PROJECT_ID" \
            --provenance=false \
            -f ./dockerfiles/front-bake.hcl \
            "${BAKE_OVERRIDES[@]}" \
            --push \
            front-images
          echo "⏱️ Depot front Bake build and push took $((SECONDS - FRONT_BUILD_STARTED_SECONDS)) seconds"
        else
          # Standard single-target build for other components
          BUILD_STARTED_SECONDS=$SECONDS
          depot build \
            --project "$DEPOT_PROJECT_ID" \
            --platform linux/amd64 \
            --provenance=false \
            -f ./dockerfiles/${BASE_COMPONENT}.Dockerfile \
            -t ${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/dust-images/${COMPONENT}:${{ inputs.commit_sha }} \
            "${LATEST_TAGS[@]}" \
            "${EXTRA_TAGS[@]}" \
            --build-arg COMMIT_HASH=${{ inputs.commit_sha }} \
            --build-arg COMMIT_HASH_LONG=${{ inputs.commit_sha_long }} \
            --build-arg DD_GIT_REPOSITORY_URL=https://github.com/dust-tt/dust \
            --build-arg DD_GIT_COMMIT_SHA=${{ inputs.commit_sha_long }} \
            ${build_args[@]} \
            --push \
            .
          echo "⏱️ Depot build and push took $((SECONDS - BUILD_STARTED_SECONDS)) seconds"
        fi

    - name: Get current deployed version
      id: current_version
      shell: bash
      run: |
        COMPONENT="${{ inputs.component }}"
        echo "🔍 Getting current deployed version for ${COMPONENT} in ${{ inputs.region }}..."

        # Get all tags, exclude the current one we're building, get the most recent
        ALL_TAGS=$(gcloud container images list-tags "${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/dust-images/${COMPONENT}" \
          --limit=10 \
          --sort-by=~timestamp \
          --format="value(tags[0])" 2>/dev/null || echo "")

        # Filter out current tag and get the first remaining one
        CURRENT_TAG=""
        while IFS= read -r tag; do
          if [ -n "$tag" ] && [ "$tag" != "${{ inputs.commit_sha }}" ]; then
            CURRENT_TAG="$tag"
            break
          fi
        done <<< "$ALL_TAGS"

        echo "Current deployed version: ${CURRENT_TAG:-'none found'}"
        echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT

    - name: Get commit diff
      if: steps.current_version.outputs.current_tag != ''
      id: commit_info
      shell: bash
      run: |
        CURRENT_TAG="${{ steps.current_version.outputs.current_tag }}"
        TARGET_TAG="${{ inputs.commit_sha }}"

        echo "📋 Getting commit diff: $CURRENT_TAG → $TARGET_TAG"

        # Get commits between versions (handle case where CURRENT_TAG might not exist in git)
        if git rev-parse --verify "$CURRENT_TAG" >/dev/null 2>&1; then
          COMMITS_RAW=$(git log --oneline --pretty=format:"%h %s (%an)" $CURRENT_TAG..$TARGET_TAG 2>/dev/null | head -10 || true)
        else
          echo "Previous tag $CURRENT_TAG not found in git history, showing recent commits"
          COMMITS_RAW=$(git log --oneline --pretty=format:"%h %s (%an)" -10 $TARGET_TAG 2>/dev/null || true)
        fi

        # Store raw commits data
        COMMITS="$COMMITS_RAW"

        # Count commits safely
        if [ -n "$COMMITS" ]; then
          COMMIT_COUNT=$(echo "$COMMITS" | wc -l | tr -d ' ')
        else
          COMMIT_COUNT=0
        fi

        # Store results
        echo "commits<<EOF" >> $GITHUB_OUTPUT
        echo "$COMMITS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
