name: Deploy Office add-ins

# Releases are independent from front deploys: the add-ins use the public API, like the Chrome
# extension, so they must already tolerate API version skew.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-office-addins
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production Office add-ins must be deployed from main."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-node-deps
        with:
          build-sdks: "true"
          build-sparkle: "true"

      - name: Build Office add-ins
        working-directory: extension
        env:
          NEXT_PUBLIC_VIRTUOSO_LICENSE_KEY: ${{ secrets.VIRTUOSO_LICENSE_KEY }}
          DATADOG_CLIENT_TOKEN: ${{ secrets.DD_CLIENT_TOKEN }}
          COMMIT_HASH: ${{ github.sha }}
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          set -a
          source ../.github/configs/us-central1/.env.prod
          set +a
          npm run build:office

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: extension/office
          command: deploy --config wrangler.toml
          wranglerVersion: "4.80.0"
