name: Typecheck (spa)

on:
  push:
    paths:
      - package-lock.json
      - front/**
      - front-spa/**
      - sparkle/**
      - sdks/js/**
      - .github/workflows/build-spa.yaml

# Cancel superseded runs on feature branches when a new commit is pushed; never
# cancel on main so every mainline commit keeps a full CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  tsgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          build-sdks: "true"
          build-sparkle: "true"
      - name: Typecheck
        run: npm -w front-spa run tsgo -- --version && npm -w front-spa run tsgo
