name: Lint GitHub Actions workflows

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/zizmor.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/zizmor.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-github-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install actionlint and shellcheck
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # sha256 from https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl -sSL "$url" -o "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar xf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version
          shellcheck --version

      - name: Run actionlint
        run: actionlint -color

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.30.1 .github/
