name: List Image Tags

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to list tags for"
        type: choice
        options:
          - connectors
          - core
          - front
          - front-edge
          - oauth
          - prodbox
          - viz
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  list-tags:
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # v3.0.0
        with:
          create_credentials_file: true
          workload_identity_provider: "projects/357744735673/locations/global/workloadIdentityPools/github-pool-apps/providers/github-provider-apps"
          service_account: "github-build-invoker@dust-infra.iam.gserviceaccount.com"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1

      - name: List available tags
        run: |
          # The front releases run the front-api images.
          case "${{ inputs.component }}" in
            front) IMAGE="front-api" ;;
            front-edge) IMAGE="front-api-edge" ;;
            *) IMAGE="${{ inputs.component }}" ;;
          esac
          IMAGE_REPO="us-central1-docker.pkg.dev/dust-infra/dust-images/${IMAGE}"

          echo "Latest tags in ${IMAGE_REPO}:"
          echo "-------------------------------------------"
          gcloud container images list-tags "${IMAGE_REPO}" \
            --limit=10 \
            --sort-by=~timestamp \
            --format="table(timestamp.date('%Y-%m-%d %H:%M:%S'),tags[0])"
