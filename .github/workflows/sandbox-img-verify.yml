name: Sandbox Image Verify

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: eu, domain: e2b-juliett.dev }
          - { name: us, domain: e2b.dev }
          - { name: cell-00002, domain: e2b-juliett.dev }
    steps:
      - name: Configure E2B for ${{ matrix.target.name }}
        run: |
          case "${{ matrix.target.name }}" in
            eu)          E2B_KEY="${{ secrets.E2B_API_KEY }}" ;;
            us)          E2B_KEY="${{ secrets.E2B_US_API_KEY }}" ;;
            cell-00002)  E2B_KEY="${{ secrets.E2B_CELL_00002_API_KEY }}" ;;
            *)
              echo "::error::no E2B API key mapped for target ${{ matrix.target.name }}"
              exit 1 ;;
          esac
          echo "E2B_API_KEY=$E2B_KEY" >> "$GITHUB_ENV"
          echo "E2B_DOMAIN=${{ matrix.target.domain }}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          build-sdks: "true"

      - name: Verify sandbox templates
        working-directory: front
        run: |
          if ! npx tsx scripts/sandbox_image_verify.ts; then
            echo "::error::Sandbox template verification failed (${{ matrix.target.name }}). Build the missing templates from main with the Sandbox Image Registry workflow before deploying."
            exit 1
          fi
