name: Lint & Build & Test (dfs)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      dfs-changed: ${{ steps.changes.outputs.dfs }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for relevant changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          base: ${{ github.event.repository.default_branch }}
          filters: |
            dfs:
              - 'dfs/**'
              - '.github/workflows/build-and-test-dfs.yml'

  test:
    name: Build and test DFS
    runs-on: ubuntu-latest
    needs: check-changes
    if: github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.dfs-changed == 'true'
    timeout-minutes: 20
    env:
      # Keep the client and server on the same version as the hive setup.
      FDB_VERSION: "7.3.69"
      FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@aad518f59d88bae90133242f9ddac7f8bbc5dddf # 1.94.1
        with:
          components: clippy, rustfmt

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install FoundationDB
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update
          for package in clients server; do
            package_file="foundationdb-${package}_${FDB_VERSION}-1_amd64.deb"
            package_url="https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/${package_file}"
            curl --fail --location --retry 3 --output "$package_file" "$package_url"
            curl --fail --location --retry 3 --output "${package_file}.sha256" "${package_url}.sha256"
            sha256sum --check "${package_file}.sha256"
          done
          sudo apt-get install -y --no-install-recommends libclang-dev \
            "./foundationdb-clients_${FDB_VERSION}-1_amd64.deb" \
            "./foundationdb-server_${FDB_VERSION}-1_amd64.deb"
          ready_deadline_seconds=$((SECONDS + 60))
          until fdbcli -C "$FDB_CLUSTER_FILE" --timeout 5 --exec "status minimal" | grep -q "The database is available"; do
            if (( SECONDS >= ready_deadline_seconds )); then
              echo "Timed out waiting for FoundationDB." >&2
              exit 1
            fi
            sleep 1
          done

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            dfs/protocol
            dfs/server
            dfs/mount

      - name: Format
        run: |
          cargo fmt --manifest-path dfs/protocol/Cargo.toml --all -- --check
          cargo fmt --manifest-path dfs/server/Cargo.toml --all -- --check
          cargo fmt --manifest-path dfs/mount/Cargo.toml --all -- --check

      - name: Lint
        run: |
          cargo clippy --manifest-path dfs/protocol/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path dfs/server/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path dfs/mount/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: |
          cargo build --manifest-path dfs/protocol/Cargo.toml --locked
          cargo build --manifest-path dfs/server/Cargo.toml --locked
          cargo build --manifest-path dfs/mount/Cargo.toml --locked

      - name: Test
        run: |
          cargo test --manifest-path dfs/protocol/Cargo.toml --all --locked
          cargo test --manifest-path dfs/server/Cargo.toml --all --locked
          cargo test --manifest-path dfs/mount/Cargo.toml --all --locked
