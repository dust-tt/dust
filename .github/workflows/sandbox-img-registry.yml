name: Sandbox Image Registry

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Force rebuild all images (even if templates already exist)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if the run is from main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Error: sandbox images can only be built from the main branch"
          exit 1

  check-and-build:
    needs: [ check-branch ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One target per E2B team: templates are team-scoped, so each cluster that
      # runs sandboxes needs its own build. The legacy regions and every cell
      # each have their own team (their own E2B API key). Adding a cell is one
      # entry here plus its E2B key as a secret, mapped in the step below.
      matrix:
        target:
          - { name: eu, domain: e2b-juliett.dev }
          - { name: us, domain: e2b.dev }
          - { name: cell-00002, domain: e2b-juliett.dev }
    steps:
      - name: Configure E2B for ${{ matrix.target.name }}
        run: |
          case "${{ matrix.target.name }}" in
            eu)          E2B_KEY="${{ secrets.E2B_API_KEY }}" ;;
            us)          E2B_KEY="${{ secrets.E2B_US_API_KEY }}" ;;
            cell-00002)  E2B_KEY="${{ secrets.E2B_CELL_00002_API_KEY }}" ;;
            *)
              echo "::error::no E2B API key mapped for target ${{ matrix.target.name }}"
              exit 1 ;;
          esac
          echo "E2B_API_KEY=$E2B_KEY" >> "$GITHUB_ENV"
          echo "E2B_DOMAIN=${{ matrix.target.domain }}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          build-sdks: "true"

      - name: Check sandbox images
        id: check
        working-directory: front
        run: |
          set -eo pipefail
          REBUILD="${{ inputs.rebuild || 'false' }}"
          echo "Running sandbox image check (${{ matrix.target.name }})... (rebuild=$REBUILD)"
          if ! RESULT=$(npx tsx scripts/sandbox_image_check.ts --json 2>&1); then
            echo "::error::Sandbox image check failed (${{ matrix.target.name }})"
            echo "$RESULT"
            exit 1
          fi
          echo "Check result (${{ matrix.target.name }}):"
          echo "$RESULT"

          if [ "$REBUILD" == "true" ]; then
            MISSING=$(echo "$RESULT" | jq -c '.result.required')
            HAS_MISSING=$(echo "$RESULT" | jq -r 'if (.result.required | length) > 0 then "true" else "false" end')
            echo "Force rebuild: treating all images as needing build"
            BUILD_MATRIX=$(echo "$RESULT" | jq -c '.result.allBuildMatrix')
          else
            MISSING=$(echo "$RESULT" | jq -c '.result.missing')
            HAS_MISSING=$(echo "$RESULT" | jq -r 'if (.result.missing | length) > 0 then "true" else "false" end')
            BUILD_MATRIX=$(echo "$RESULT" | jq -c '.result.buildMatrix')
          fi

          echo "has-missing=$HAS_MISSING" >> "$GITHUB_OUTPUT"

          HAS_JSON=$( [ "$HAS_MISSING" == "true" ] && echo true || echo false )
          jq -nc --argjson missing "$MISSING" --argjson buildMatrix "$BUILD_MATRIX" \
            --arg r "${{ matrix.target.name }}" --argjson hasMissing "$HAS_JSON" \
            '{region: $r, missing: $missing, buildMatrix: $buildMatrix, hasMissing: $hasMissing}' \
            > "$GITHUB_WORKSPACE/check-result.json"

          echo "$BUILD_MATRIX" > "$GITHUB_WORKSPACE/build-matrix.json"

      - name: Upload check result
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-img-check-${{ matrix.target.name }}
          path: check-result.json

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.check.outputs.has-missing == 'true'

      - name: Write service account JSON
        if: steps.check.outputs.has-missing == 'true'
        run: |
          echo '${{ secrets.SBX_GCP_ARTIFACT_RO_SERVICE_ACCOUNT_JSON }}' > /tmp/service-account.json

      - name: Build missing sandbox images
        if: steps.check.outputs.has-missing == 'true'
        working-directory: front
        env:
          SBX_GCP_ARTIFACT_SERVICE_ACCOUNT: /tmp/service-account.json
        run: |
          set -eo pipefail
          REBUILD="${{ inputs.rebuild || 'false' }}"
          REBUILD_FLAG=""
          if [ "$REBUILD" == "true" ]; then
            REBUILD_FLAG="--rebuild"
          fi
          while IFS= read -r row; do
            image=$(echo "$row" | jq -r '.image')
            tag=$(echo "$row" | jq -r '.tag')
            echo "Building ${image}:${tag} (${{ matrix.target.name }})"
            npx tsx scripts/sandbox_image_build.ts \
              --image "$image" \
              --tag "$tag" \
              --docker-registry us-central1-docker.pkg.dev/or1g1n-186209/dust-sbx \
              --confirm \
              --release \
              $REBUILD_FLAG
          done < <(jq -c '.[]' "$GITHUB_WORKSPACE/build-matrix.json")

      - name: Run sandbox security regression checks
        if: steps.check.outputs.has-missing == 'true'
        working-directory: front
        run: |
          set -eo pipefail
          while IFS= read -r row; do
            image=$(echo "$row" | jq -r '.image')
            tag=$(echo "$row" | jq -r '.tag')
            echo "Checking ${image}:${tag} (${{ matrix.target.name }})"
            npx tsx scripts/sandbox_security_check.ts \
              --image "$image" \
              --tag "$tag"
          done < <(jq -c '.[]' "$GITHUB_WORKSPACE/build-matrix.json")

      - name: Cleanup service account JSON
        if: always() && steps.check.outputs.has-missing == 'true'
        run: rm -f /tmp/service-account.json

  summary:
    needs: [ check-and-build ]
    if: always() && needs['check-and-build'].result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download every target's check result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sandbox-img-check-*
          path: checks

      - name: Aggregate summary
        id: count
        run: |
          set -eo pipefail
          # One check-result.json per target, in its own subfolder.
          ALL=$(find checks -name check-result.json -exec cat {} +)
          HAS=$(echo "$ALL" | jq -s 'map(.hasMissing) | any')
          SUMMARY=$(echo "$ALL" | jq -s -c 'map({(.region): .missing}) | add')
          COUNT=$(echo "$ALL" | jq -s '[.[].buildMatrix | length] | add')
          {
            echo "has-missing=$HAS"
            echo "missing-summary=$SUMMARY"
            echo "planned-builds=$COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "## Sandbox Image Check Summary"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.count.outputs.has-missing }}" == "true" ]; then
            {
              echo "Built **${{ steps.count.outputs.planned-builds }}** image(s) across every E2B target (sequential per target)."
              echo ""
              echo "### Missing by target (before build):"
              echo '```json'
              echo '${{ steps.count.outputs.missing-summary }}'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All required sandbox images already exist in every E2B target" >> "$GITHUB_STEP_SUMMARY"
          fi
