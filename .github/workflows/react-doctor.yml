name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    # Skip when the PR carries the `disable-react-doctor` label. On push events
    # there are no PR labels, so `contains` is false and the job still runs.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'disable-react-doctor') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: millionco/react-doctor@673ce802a375eeb4c3c5cb9a96d21eaeb7eafd93 # v2.3.1
        with:
          version: "0.9.14"
          blocking: none
          scope: changed
          comment: false
