name: Release dsbx CLI

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release_dsbx
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3f004e7c9fe9026f3384e581eb4a157ada8ef5b8 # 1.94.1

      - name: Install cross
        # Pinned to a cross-rs/cross commit (main as of 2026-09-24; the last release,
        # v0.2.5, is from 2023) with --locked, so every release build runs the same
        # toolchain code. When bumping the rev, re-resolve the image digest below.
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev 74e99b2223de06166f8cdcc1af7f1308ec52baf4

      - name: Get version
        id: version
        working-directory: cli/dust-sandbox
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Build functions runner bundle
        # runner.js is a generated bundle (not committed). Build it on the host
        # so cross only needs to mount and embed it — bun is not required inside
        # the cross/musl build container.
        working-directory: cli/dust-sandbox/functions-runner
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build with cross
        working-directory: cli/dust-sandbox
        env:
          # Digest of ghcr.io/cross-rs/x86_64-unknown-linux-musl:main, the image the
          # pinned cross rev would otherwise pull by mutable tag.
          CROSS_TARGET_X86_64_UNKNOWN_LINUX_MUSL_IMAGE: ghcr.io/cross-rs/x86_64-unknown-linux-musl@sha256:664b119c13833d07bbbfb60f17cfa6f8b4e7d730bf30aad31dd803887ecd7e39
        run: cross build --release --target x86_64-unknown-linux-musl

      - name: Prepare release artifacts
        id: artifacts
        run: |
          mkdir -p artifacts
          cp cli/dust-sandbox/target/x86_64-unknown-linux-musl/release/dsbx artifacts/dsbx-linux-x86_64
          cd artifacts
          sha256sum dsbx-linux-x86_64 > checksums-sha256.txt
          echo "sha256=$(cut -d" " -f1 checksums-sha256.txt)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: dsbx-v${{ steps.version.outputs.version }}
          name: dsbx v${{ steps.version.outputs.version }}
          body: |
            ## dsbx CLI v${{ steps.version.outputs.version }}

            **Commit**: ${{ github.sha }}

            **SHA-256** (`dsbx-linux-x86_64`): `${{ steps.artifacts.outputs.sha256 }}`. Pin it as `DSBX_CLI_SHA256` in `front/lib/api/sandbox/image/registry.ts`.

            ### Download

            | Platform | Architecture | Binary |
            |----------|--------------|--------|
            | Linux    | x86_64       | `dsbx-linux-x86_64` |

            ### Installation

            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/dsbx-v${{ steps.version.outputs.version }}/dsbx-linux-x86_64
            chmod +x dsbx-linux-x86_64
            sudo mv dsbx-linux-x86_64 /usr/local/bin/dsbx
            ```

            ### Verify checksum

            ```bash
            sha256sum -c checksums-sha256.txt
            ```
          files: |
            artifacts/dsbx-linux-x86_64
            artifacts/checksums-sha256.txt
          fail_on_unmatched_files: true
