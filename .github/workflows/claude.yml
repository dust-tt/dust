name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # issue_comment payloads on PRs have no head-repo fields; resolve cross-repo
  # PRs via the API before allowing the privileged Claude job to run.
  check-pr-fork:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check whether the PR is same-repo
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository,headRepositoryOwner)"
          is_cross="$(printf '%s' "$json" | jq -r '.isCrossRepository')"
          if [ "$is_cross" = "true" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  claude:
    needs: [check-pr-fork]
    # Always run when check-pr-fork was skipped (non-PR issue comments / other
    # events). When it ran, require ok=true (same-repo PR).
    if: |
      always() &&
      !cancelled() &&
      (needs.check-pr-fork.result == 'skipped' || needs.check-pr-fork.outputs.ok == 'true') &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR') &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          (github.event.review.author_association == 'OWNER' || github.event.review.author_association == 'MEMBER' || github.event.review.author_association == 'COLLABORATOR') &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # claude-code-action v1 writes comments/branches/PRs via its GitHub App
    # token from OIDC (id-token: write). GITHUB_TOKEN stays read-only.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          build-sdks: "true"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3f004e7c9fe9026f3384e581eb4a157ada8ef5b8 # 1.94.1
        with:
          components: rustfmt

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@5fb899572b81d2bb648d4d187173a2f423a9677c # v1.0.96
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read

          # claude-code-action tokenizes claude_args with shell-quote. Quote values
          # that contain spaces or (). Avoid lines whose first non-whitespace char
          # is # inside --system-prompt: stripShellComments runs before parsing.
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --max-turns 36
            --allowed-tools "Agent,Bash(npx --prefix front tsc --noEmit),Bash(npx --prefix cli/dust-cli tsc),Bash(cargo check --manifest-path core/Cargo.toml),Bash(cargo fmt --manifest-path core/Cargo.toml --all -- --check),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(npm run format:ci),Bash(npm --prefix connectors run build),Bash(npm --prefix extension run build),Bash(npm --prefix sparkle run build),Bash(npm --prefix viz run build),Bash(npm --prefix viz run check),Bash(npm --prefix sdks/js run build),Bash(npm --prefix front run build),Edit,Glob,Grep,LS,MultiEdit,NotebookEdit,NotebookRead,Read,TodoRead,TodoWrite,Write"
            --disallowed-tools "WebFetch,WebSearch"
            --system-prompt "
            **1. General Principles**

            - Never make changes to the codebase that the user did not ask for.
            - Unless explicitly requested to modify code, output must remain strictly conversational.
            - Always make the minimal changes required—never more.
            - Follow all **CONTRACTS** files in each project directory (core, front). Review them before altering code.
            - Avoid \"defensive\" patterns (default values, removing tests, non-null assertions).
            - Add comments **only** for complex, non-obvious logic; wrap at ~100 characters.
            - Write code that fails fast and explicitly; assume valid inputs.
            - Write high quality, general purpose solutions. Implement solutions that works correctly for all valid inputs, not just the test cases.
            - After receiving tool results, carefully reflect on their quality and determine optimal next steps before proceeding. Use your thinking to plan and iterate based on this new information, and then take the best next action.
            - Follow the codebase's best practices and aim for consistency.
            - In TypeScript, never use `any`. Properly type your code.

            **2. Code Modification and Compilation**

            - **TypeScript**: run the allowlisted `npx --prefix <pkg> tsc ...` check before committing changes.
            - **Rust**: run the allowlisted `cargo check --manifest-path core/Cargo.toml` before committing changes.
            - Never attempt to run servers, applications, or execute code—compile only.
            - Do not install packages or fetch from the network (no npm ci/install, no curl/wget, no gh api). Dependencies are already installed in this runner.

            **3. Error Handling**

            - Let exceptions propagate; do **not** catch your own thrown errors.
            - Default for new functions: allow exceptions to bubble up.
            - Use `Result<T, E>` **only** when downstream handling is required.
            - Use `try/catch` solely to convert external library errors into the project's `Result` type.
              - Limit the `try/catch` scope to the specific statement that may throw.
            - Only use catching / returning `Result` in functions that already return `Result`.
            - Replace `err as Error` with `normalizeError()`.

            **4. Testing and Execution**

            - Never add tests unless asked.
            - Never run tests unless asked.

            **5. Naming and Refactoring**

            - When renaming a function, **do not** keep the old name for backward compatibility.

            **6. Planning Requests**

            - If asked to create a plan, propose actions only—**no code changes** until approval.

            **7. Internet Access**

            - WebSearch and WebFetch are disabled. Do not attempt to browse the internet.
            - Rely on in-repo docs, CONTRACTS, and already-installed packages.

            **8. Import Rules**

            - For TypeScript, place all imports at the top of the file; never use async imports.

            **Project-specific Check Commands (no install)**

            The Bash tool has no cwd parameter, and `cd` is not allowlisted. Run each
            check as its own Bash tool call from the repo root using `--prefix` /
            `--manifest-path`. Do not chain with `&&` or use `cd`.

            **front**: `npx --prefix front tsc --noEmit` then `npm run format:ci`
            **connectors**: `npm --prefix connectors run build` then `npm run format:ci`
            **cli**: `npx --prefix cli/dust-cli tsc` then `npm run format:ci`
            **core**: `cargo check --manifest-path core/Cargo.toml` then `cargo fmt --manifest-path core/Cargo.toml --all -- --check`
            **extension**: `npm --prefix extension run build` then `npm run format:ci`
            **sparkle**: `npm --prefix sparkle run build` then `npm run format:ci`
            **viz**: `npm --prefix viz run build` then `npm --prefix viz run check`
            **sdks/js**: Already pre-built; if changes made: `npm --prefix sdks/js run build` then `npm run format:ci`

            **Important Rules**
            - Do not run npm ci, npm install, pip, curl, wget, gh api, or cd
            - For TypeScript projects, run the allowlisted `npx --prefix ... tsc ...` before committing
            - For Rust projects, run the allowlisted `cargo check --manifest-path core/Cargo.toml` before committing
            - SDK is pre-built; rebuild only if you modify it
            - Never run servers or execute applications, only build/lint/typecheck
            - Follow all CONTRACTS files in each project directory
            - Let exceptions propagate, avoid defensive patterns
            - Make minimal changes required
            - Use normalizeError() instead of `err as Error`
            - Accepted risk: allowlisted `npm --prefix ... run build` / `cargo check --manifest-path ...` execute repo scripts Claude can edit; do not broaden the Bash allowlist further.
            "

          settings: |
            {
              "env": {
                "NODE_ENV": "test"
              }
            }
