name: Deploy SPA to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      app:
        description: "SPA to deploy"
        type: choice
        options:
          - app
          - poke
        required: true
      env:
        description: "The environment to use for API endpoints (prod or edge)"
        type: choice
        options:
          - prod
          - edge
        default: "prod"
        required: true
      region:
        description: "Default region for API endpoint (should stay US unless we have a reason to change it)"
        type: choice
        options:
          - eu
          - us
        default: "us"
        required: true
  workflow_call:
    inputs:
      app:
        description: "SPA to deploy"
        type: string
        required: true
      env:
        description: "The environment to use for API endpoints (prod or edge)"
        type: string
        default: "prod"
        required: false
      region:
        description: "Default region for API endpoint"
        type: string
        default: "us"
        required: false
      thread_ts:
        description: "Slack thread timestamp to post in (from parent deploy workflow)"
        type: string
        default: ""
        required: false
      skip_slack:
        description: "Skip Slack notifications (e.g. for PR preview deploys)"
        type: boolean
        default: false
        required: false
    outputs:
      version_id:
        description: "Worker version ID from versions upload"
        value: ${{ jobs.deploy.outputs.version_id }}
      preview_url:
        description: "Preview URL for the deployed version"
        value: ${{ jobs.deploy.outputs.preview_url }}

concurrency:
  group: deploy-spa-${{ inputs.app }}-${{ inputs.env }}-${{ inputs.region }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Prevent edge deploys from main
        if: ${{ github.ref == 'refs/heads/main' && inputs.env == 'edge' }}
        run: |
          echo "Error: Cannot deploy with env 'edge' from the main branch"
          exit 1

  prepare:
    needs: [ check-branch ]
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.short_sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Get short sha
        id: short_sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  notify-start:
    if: ${{ !inputs.skip_slack }}
    needs: [ prepare ]
    runs-on: ubuntu-latest
    outputs:
      thread_ts: ${{ inputs.thread_ts || steps.build_message.outputs.thread_ts }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Notify SPA Deploy Start
        if: ${{ !inputs.thread_ts }}
        id: build_message
        uses: ./.github/actions/slack-notify
        with:
          step: "spa_start"
          channel: ${{ secrets.SLACK_CHANNEL_ID }}
          component: spa-${{ inputs.app }}
          image_tag: ${{ needs.prepare.outputs.short_sha }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy:
    needs: [ prepare, notify-start ]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      version_id: ${{ steps.extract_version.outputs.version_id }}
      preview_url: ${{ steps.preview_url.outputs.url }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          build-sdks: "true"
          build-sparkle: "true"

      - name: Sanitize branch name
        id: branch
        if: ${{ github.ref_name != 'main' }}
        run: |
          SANITIZED=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-//; s/-$//' | cut -c1-28 | sed 's/-$//')
          # Preview aliases must start with a letter (DNS label rule).
          if [[ "$SANITIZED" =~ ^[0-9] ]]; then
            SANITIZED="pr-${SANITIZED}"
            SANITIZED=$(echo "$SANITIZED" | cut -c1-28 | sed 's/-$//')
          fi
          echo "sanitized=${SANITIZED}" >> "$GITHUB_OUTPUT"

      - name: Build SPA
        working-directory: front-spa
        env:
          # Only main builds upload sourcemaps to Datadog.
          BUILD_SOURCEMAPS: ${{ github.ref_name == 'main' }}
          # Vite chunk rendering with sourcemaps exceeds Node's default heap limit.
          NODE_OPTIONS: "--max-old-space-size=8192"
          NEXT_PUBLIC_VIRTUOSO_LICENSE_KEY: ${{ secrets.VIRTUOSO_LICENSE_KEY }}
          NEXT_PUBLIC_DATADOG_CLIENT_TOKEN: ${{ secrets.DD_CLIENT_TOKEN }}
          NEXT_PUBLIC_DATADOG_SERVICE: ${{ inputs.app }}-spa
          NEXT_PUBLIC_COMMIT_HASH: ${{ needs.prepare.outputs.short_sha }}
          INPUTS_ENV: ${{ inputs.env }}
          STEPS_BRANCH_OUTPUTS_SANITIZED: ${{ steps.branch.outputs.sanitized }}
          INPUTS_APP: ${{ inputs.app }}
          CONFIG_REGION_DIR: ${{ inputs.region == 'eu' && 'europe-west1' || 'us-central1' }}
        run: |
          set -a
          # shellcheck disable=SC1090  # path is built from trusted workflow inputs via env
          source "../.github/configs/${CONFIG_REGION_DIR}/.env.${INPUTS_ENV}"
          # Override NEXT_PUBLIC_DUST_APP_URL: use branch preview URL for non-main branches.
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            export NEXT_PUBLIC_DUST_APP_URL="https://${STEPS_BRANCH_OUTPUTS_SANITIZED}--app.preview.dust.tt"
          fi
          # shellcheck disable=SC2034  # exported via set -a, used by VITE_* mapping loop below
          NEXT_PUBLIC_BUILD_DATE=$(date +%s)
          # Map all NEXT_PUBLIC_* to VITE_* for SPA
          for var in $(compgen -v | grep '^NEXT_PUBLIC_'); do
            export "VITE_${var#NEXT_PUBLIC_}=${!var}"
          done
          set +a
          npm run "build:${INPUTS_APP}"

      - name: Upload sourcemaps to Datadog
        if: ${{ github.ref_name == 'main' }}
        working-directory: front-spa
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DATADOG_SITE: datadoghq.eu
          INPUTS_APP: ${{ inputs.app }}
          NEEDS_PREPARE_OUTPUTS_SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          if [ -z "$DATADOG_API_KEY" ]; then
            echo "DD_API_KEY not set, skipping sourcemap upload"
            exit 0
          fi
          npx --yes @datadog/datadog-ci sourcemaps upload "dist/${INPUTS_APP}/assets" \
            --minified-path-prefix=/assets/ \
            --repository-url=https://github.com/dust-tt/dust \
            --project-path=front-spa \
            --release-version="${NEEDS_PREPARE_OUTPUTS_SHORT_SHA}" \
            --service="${INPUTS_APP}-spa-browser"

      - name: Remove sourcemaps
        working-directory: front-spa
        run: find dist -name "*.map" -delete

      - name: Upload version
        id: upload_version
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: front-spa
          command: >-
            versions upload
            --config wrangler-${{ inputs.app }}.toml
            ${{ github.ref_name != 'main'
              && format('--preview-alias {0}', steps.branch.outputs.sanitized)
              || '' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.80.0"

      - name: Extract version ID
        id: extract_version
        run: |
          UPLOAD_OUTPUT="${STEPS_UPLOAD_VERSION_OUTPUTS_COMMAND_OUTPUT}"
          VERSION_ID=$(echo "$UPLOAD_OUTPUT" | sed -n 's/.*Worker Version ID: *\([0-9a-f-]*\).*/\1/p')
          if [ -z "$VERSION_ID" ]; then
            echo "Failed to extract version ID from upload output:"
            echo "$UPLOAD_OUTPUT"
            exit 1
          fi
          echo "version_id=${VERSION_ID}" >> "$GITHUB_OUTPUT"
          VERSION_PREFIX=$(echo "$VERSION_ID" | cut -c1-8)
          echo "version_prefix=${VERSION_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "Extracted version ID: ${VERSION_ID} (prefix: ${VERSION_PREFIX})"
        env:
          STEPS_UPLOAD_VERSION_OUTPUTS_COMMAND_OUTPUT: ${{ steps.upload_version.outputs.command-output }}

      - name: Derive preview URL
        id: preview_url
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "url=https://${STEPS_EXTRACT_VERSION_OUTPUTS_VERSION_PREFIX}--${INPUTS_APP}.preview.dust.tt" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://${STEPS_BRANCH_OUTPUTS_SANITIZED}--${INPUTS_APP}.preview.dust.tt" >> "$GITHUB_OUTPUT"
          fi
        env:
          STEPS_EXTRACT_VERSION_OUTPUTS_VERSION_PREFIX: ${{ steps.extract_version.outputs.version_prefix }}
          INPUTS_APP: ${{ inputs.app }}
          STEPS_BRANCH_OUTPUTS_SANITIZED: ${{ steps.branch.outputs.sanitized }}

      - name: Summary
        run: |
          {
            echo "### SPA Deployed :rocket:"
            echo ""
            echo "- **App**: ${INPUTS_APP}"
            echo "- **URL**: ${STEPS_PREVIEW_URL_OUTPUTS_URL}"
            echo "- **Region**: ${INPUTS_REGION}"
            echo "- **Commit**: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          INPUTS_APP: ${{ inputs.app }}
          STEPS_PREVIEW_URL_OUTPUTS_URL: ${{ steps.preview_url.outputs.url }}
          INPUTS_REGION: ${{ inputs.region }}

      - name: Notify Deploy Success
        if: ${{ !inputs.skip_slack }}
        uses: ./.github/actions/slack-notify
        with:
          step: spa_preview_success
          channel: ${{ secrets.SLACK_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-start.outputs.thread_ts }}
          component: spa-${{ inputs.app }}
          image_tag: ${{ needs.prepare.outputs.short_sha }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          preview_url: ${{ steps.preview_url.outputs.url }}

      - name: Notify Failure
        if: ${{ failure() && !inputs.skip_slack }}
        uses: ./.github/actions/slack-notify
        with:
          step: "failure"
          channel: ${{ secrets.SLACK_CHANNEL_ID }}
          component: spa-${{ inputs.app }}
          image_tag: ${{ needs.prepare.outputs.short_sha }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: "${{ needs.notify-start.outputs.thread_ts }}"
