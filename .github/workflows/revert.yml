name: Revert Workflow
run-name: Revert ${{ inputs.component }} in ${{ inputs.cells }}

on:
  workflow_dispatch:
    inputs:
      cells:
        description: "Cells to revert (cell-00000 is us-central1, cell-00001 europe-west1)"
        required: true
        default: "all"
        type: choice
        options:
          - "cell-00000"
          - "cell-00001"
          - "cell-00002"
          - "all"
      image_tag:
        description: "The image tag/SHA to deploy"
        type: string
        required: true
      component:
        description: "Component to revert"
        type: choice
        options:
          - connectors
          - core
          - front
          - front-edge
          - front-sse
          - oauth
          - prodbox
          - viz
        required: true
      enforce_main:
        description: "Require revert to run from main branch"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  check-branch:
    runs-on: ubuntu-latest
    if: ${{ !inputs.enforce_main || github.ref == 'refs/heads/main' }}
    steps:
      - name: Check branch condition
        run: |
          if [[ "${{ inputs.enforce_main }}" == "true" && "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Reverts are only allowed from the main branch"
            exit 1
          fi

  notify-start:
    runs-on: ubuntu-latest
    outputs:
      thread_ts: ${{ steps.card.outputs.thread_ts }}
      card: ${{ steps.card.outputs.card }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate infra token
        id: infra-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.INFRA_DISPATCH_APP_ID }}
          private-key: ${{ secrets.INFRA_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dust-infra

      - name: Post the deployment card
        id: card
        uses: ./.github/actions/deploy-card
        with:
          component: ${{ inputs.component }}
          image_tag: ${{ inputs.image_tag }}
          cells: ${{ inputs.cells }}
          is_revert: "true"
          channel: ${{ secrets.SLACK_CHANNEL_ID }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          infra_token: ${{ steps.infra-token.outputs.token }}

  # Images are built once into the global registry, so one check covers every region.
  validate-image:
    permissions:
      contents: read
      id-token: write
    needs: [notify-start]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # v3.0.0
        with:
          create_credentials_file: true
          workload_identity_provider: "projects/357744735673/locations/global/workloadIdentityPools/github-pool-apps/providers/github-provider-apps"
          service_account: "github-build-invoker@dust-infra.iam.gserviceaccount.com"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1

      - name: Validate image tag exists
        run: |
          # The front releases run the front-api images.
          case "${{ inputs.component }}" in
            front|front-sse) IMAGE="front-api" ;;
            front-edge) IMAGE="front-api-edge" ;;
            *) IMAGE="${{ inputs.component }}" ;;
          esac
          IMAGE_REPO="us-central1-docker.pkg.dev/dust-infra/dust-images/${IMAGE}"

          echo "Validating image tag ${{ inputs.image_tag }} exists in ${IMAGE_REPO}"

          if ! gcloud container images describe "${IMAGE_REPO}:${{ inputs.image_tag }}" --quiet >/dev/null 2>&1; then
            echo "❌ Image tag '${{ inputs.image_tag }}' not found in registry ${IMAGE_REPO}"
            echo "Available tags:"
            gcloud container images list-tags "${IMAGE_REPO}" \
              --limit=10 \
              --sort-by=~timestamp \
              --format="table(timestamp.date('%Y-%m-%d %H:%M:%S'),tags[0])"
            exit 1
          fi

          echo "✅ Image tag '${{ inputs.image_tag }}' exists in ${IMAGE_REPO}" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Failure
        if: failure()
        uses: ./.github/actions/slack-notify
        with:
          step: "failure"
          channel: ${{ secrets.SLACK_CHANNEL_ID }}
          component: ${{ inputs.component }}
          image_tag: ${{ inputs.image_tag }}
          region: ${{ inputs.cells }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: "${{ needs.notify-start.outputs.thread_ts }}"
          is_revert: true

  revert:
    needs: [notify-start, validate-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.INFRA_DISPATCH_APP_ID }}
          private-key: ${{ secrets.INFRA_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dust-infra

      - name: Trigger dust-infra workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: '${{ github.repository_owner }}',
              repo: 'dust-infra',
              event_type: 'trigger-component-revert',
              client_payload: {
                cells: '${{ inputs.cells }}',
                component: '${{ inputs.component }}',
                image_tag: '${{ inputs.image_tag }}',
                slack_thread_ts: "${{ needs.notify-start.outputs.thread_ts }}",
                card: ${{ toJSON(needs.notify-start.outputs.card) }},
                slack_channel: '${{ secrets.SLACK_CHANNEL_ID }}',
                run_playwright: false,
              }
            })

      - name: Notify Failure
        if: failure()
        uses: ./.github/actions/slack-notify
        with:
          step: "failure"
          channel: ${{ secrets.SLACK_CHANNEL_ID }}
          component: ${{ inputs.component }}
          image_tag: ${{ inputs.image_tag }}
          region: ${{ inputs.cells }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: "${{ needs.notify-start.outputs.thread_ts }}"
          is_revert: true
