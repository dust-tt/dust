name: Main breakage notifier
run-name: ${{ github.event.workflow_run.name }} ${{ github.event.workflow_run.conclusion }} on main

on:
  workflow_run:
    workflows:
      - Lint & Build & Test (front)
      - Lint & Build & Test (front-api)
      - Lint & Build & Test (connectors)
      - Lint & Build & Test (core)
      - Lint & Build (marketing)
      - Lint & Build (sparkle)
      - Typecheck (spa)
      - Format/lint checks (Biome)
      - Check no new bulk Biome suppressions
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Notify Slack on a main state change
        uses: ./.github/actions/main-breakage
        with:
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: C09GELMTTRT
