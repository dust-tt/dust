name: Lint & Build & Test (connectors)

on:
  push:
    paths:
      - package-lock.json
      - sdks/js/**
      - connectors/**
      - lingui.config.ts
      - scripts/i18n/**
      - .github/workflows/build-and-test-connectors.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  tsgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          build-sdks: "true"
          node-version: "24.14.0"
      - name: Typecheck
        run: npm -w connectors run tsgo -- --version && npm -w connectors run tsgo
      - name: Test SDK
        run: npm -w sdks/js run test
      - name: Build Temporal Bundles
        working-directory: connectors
        env:
          CONNECTORS_DATABASE_URI: "postgres://fake:fake@localhost:5432/fake"
        run: npm run build:temporal-bundles
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Check translation catalogs
        run: npm run i18n:check
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/postgres:14.13
        env:
          POSTGRES_DB: connectors_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        # Check TCP readiness so the temporary initialization server cannot pass.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d connectors_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          build-sdks: "true"
          node-version: "24.14.0"
      - name: Run Tests
        working-directory: connectors
        env:
          CONNECTORS_DATABASE_URI: "postgres://test:test@localhost:5433/connectors_test"
          NODE_ENV: test
        run: npx tsx src/admin/db.ts && npm run test:ci
      - name: Build Tests Report
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: "**/connectors/junit*.xml"
          detailed_summary: true
          flaky_summary: true
          group_suite: true
          check_name: Tests Report
